# FaceLift vs Pose-Splatter Unified Evaluation Config
# Created: 2026-02-15
#
# Usage:
#   python -m mouse_extensions.scripts.eval.compare_with_baseline \
#     --facelift_metrics ${facelift.metrics_path} \
#     --baseline_metrics ${posesplatter.metrics_path} \
#     --output_dir ${output.dir}

# ============================================================
# Dataset alignment
# ============================================================
dataset:
  name: "markerless_mouse_1_nerf"
  # FaceLift M5 dataset on gpu03
  facelift_gt_dir: "/home/joon/data/preprocessed/FaceLift_mouse/M5"
  # Pose-Splatter preprocessed data on joon
  posesplatter_data_dir: "/media/joon/kafka/data/preprocessed/markerless_mouse_1_nerf/fj5_ds2"

  # Common evaluation parameters
  num_cameras: 6
  train_views: [0, 1, 2, 3, 4]
  holdout_views: [5]
  target_resolution: [512, 512]  # H, W

# ============================================================
# FaceLift experiment paths (gpu03)
# ============================================================
facelift:
  repo_root: "/home/joon/dev/FaceLift"
  experiments:
    # Best current E2E result
    cfgr_ckpt10000:
      output_dir: "outputs/h5_e2e/cfgr_ckpt10000"
      metrics_path: "outputs/h5_e2e/cfgr_ckpt10000/metrics_v2.json"
      description: "E2E config-refactored, ckpt 10000"
    baseline_ckpt5000:
      output_dir: "outputs/h5_e2e/baseline_ckpt5000"
      metrics_path: "outputs/h5_e2e/baseline_ckpt5000/metrics_v2.json"
      description: "Baseline E2E, ckpt 5000"

