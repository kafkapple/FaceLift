# ============================================================
# Metrics to compute
# ============================================================
metrics:
  # Primary (literature standard)
  primary:
    - psnr_full_white    # White-BG composite + full-image MSE
    - ssim_full_white    # White-BG composite + skimage
    - mask_iou           # Silhouette IoU (alpha > 0.5)
    - l1_masked          # sum|pred-gt| / (3 * sum(mask))

  # Secondary (diagnostic)
  secondary:
    - lpips_full_white   # AlexNet backbone (FaceLift only)
    - psnr_fg_only       # Foreground-only PSNR (diagnostic)
    - psnr_alpha_weighted  # Alpha-weighted PSNR (GS-LRM training)

  # Directions (higher/lower is better)
  directions:
    psnr_full_white: higher
    ssim_full_white: higher
    mask_iou: higher
    l1_masked: lower
    lpips_full_white: lower
    psnr_fg_only: higher
    psnr_alpha_weighted: higher

# ============================================================
# Output
# ============================================================
output:
  dir: "experiments/comparison/FL_vs_PS"
  formats:
    - json         # metrics_comparison.json
    - markdown     # comparison_report.md
  # Optional: WandB logging
  wandb:
    enabled: false
    project: "facelift-mouse"
    entity: null

# ============================================================
# Known metric protocol differences
# ============================================================
# IMPORTANT: The two models use different metric protocols by default.
#
# FaceLift (compute_e2e_metrics.py v2.0):
#   - Composites pred and GT onto WHITE background using alpha
#   - Computes PSNR/SSIM on the FULL image (including background)
#   - Background pixels are easy → inflates PSNR/SSIM
#   - This is the standard in LGM, GS-LRM literature
#
# Pose-Splatter (image_metrics.py):
#   - Extracts foreground pixels using binary mask
#   - Computes PSNR/SSIM only on foreground pixels
#   - More challenging → lower absolute numbers
#   - Standard in the animal pose estimation literature
#
# For fair comparison:
#   Option A: Re-render PS outputs with white-BG, eval full-image (align to FL)
#   Option B: Re-eval FL outputs with mask extraction (align to PS)
#   Option C: Report both protocols side-by-side with clear labeling
#
# Currently using Option C (safest, most informative).
