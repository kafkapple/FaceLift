title: "FL vs PS: 6-View Condition (M5t2)"

dataset:
  name: M5t2
  split: test (frames 3240-3599)
  total_views: 6
  resolution: 512
  gt_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  gt_pattern: "{fid}/images/cam_{vid:03d}.png"
  info: >
    Mouse M5 dataset, 3600 frames × 6 views × 512×512.
    Split: Train 0-2879 (80%), Val 2880-3239 (10%), Test 3240-3599 (10%).
    6-view condition: 5 training views [0,1,2,3,4], holdout view 5.

experiments:
  - name: "FL GS-LRM 5v"
    method: facelift
    pipeline: gslrm (5-view input)
    input_views: 5
    metrics_json: experiments/comparison/tier/gslrm_5view_fair.json
    render_dir: outputs/tier_comparison/gslrm_5view_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#1f77b4"

  - name: "FL E2E"
    method: facelift
    pipeline: e2e (1-view input)
    input_views: 1
    metrics_json: experiments/comparison/tier/e2_resume_20k_fair.json
    render_dir: outputs/_archive_renders/E2_resume_20k/samples
    render_pattern: "{fid}/cam_000/render_view_{vid:02d}.png"
    color: "#ff7f0e"

  - name: "PS M5 6v"
    method: pose-splatter
    pipeline: per-scene (50 epochs)
    input_views: 6
    metrics_json: /tmp/ps_m5_fair_results.json
    render_dir: /tmp/ps_renders
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#2ca02c"

protocols:
  a_temporal:
    name: "Protocol A: Temporal NVS"
    description: "All 6 views evaluated on test frames (3240-3599). Measures temporal generalization."
    source: overall

  b_spatial:
    name: "Protocol B: Spatial NVS (Holdout View 5)"
    description: "Holdout view 5 metrics across all frames. Measures spatial generalization to unseen viewpoints."
    source: per_view
    holdout_view: 5
    holdout_key: view_5

metrics:
  primary:
    - psnr_gt_masked
    - iou
  secondary:
    - psnr_intersection
    - coverage
    - ssim_gt_masked

visualization:
  sample_frames: [3240, 3300, 3360, 3420, 3480, 3540]
  img_size: 200
  findings:
    - "FL GS-LRM 5v (feed-forward) outperforms PS M5 (per-scene, 50 epochs) by +9.6 dB PSNR_fg."
    - "Coverage gap (FL ~100% vs PS 89.3%) is the primary driver of PSNR_fg difference."
    - "PSNR_intersection (pure color accuracy on overlap) shows FL still leads by ~3 dB."
    - "FL E2E (MVDiff → GS-LRM) suffers from Stage 1 bottleneck: ~10% transfer rate from GT performance."
