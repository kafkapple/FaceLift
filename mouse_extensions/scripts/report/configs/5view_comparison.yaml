title: "FL vs PS: 5-View Condition (M5t2)"

dataset:
  name: M5t2
  split: test (frames 3240-3599)
  total_views: 6
  resolution: 512
  gt_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  gt_pattern: "{fid}/images/cam_{vid:03d}.png"
  info: >
    5-view condition: 4 training views [0,1,2,3], holdout view 4.
    PS trains on 4 views only, FL uses 4-view GS-LRM model.

experiments:
  - name: "FL GS-LRM 4v"
    method: facelift
    pipeline: gslrm (4-view input)
    input_views: 4
    metrics_json: experiments/comparison/tier/gslrm_4view_fair.json
    render_dir: outputs/tier_comparison/gslrm_4view_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#1f77b4"

  - name: "FL E2E"
    method: facelift
    pipeline: e2e (1-view input)
    input_views: 1
    metrics_json: experiments/comparison/tier/e2_resume_20k_fair.json
    render_dir: outputs/_archive_renders/E2_resume_20k/samples
    render_pattern: "{fid}/cam_000/render_view_{vid:02d}.png"
    color: "#ff7f0e"

  - name: "PS M5 5v"
    method: pose-splatter
    pipeline: per-scene (50 epochs)
    input_views: 4
    metrics_json: /tmp/ps_m5_5v_fair_results.json
    render_dir: ""
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#2ca02c"

protocols:
  a_temporal:
    name: "Protocol A: Temporal NVS"
    description: "All 6 views evaluated on test frames (3240-3599). Measures temporal generalization."
    source: overall

  b_spatial:
    name: "Protocol B: Spatial NVS (Holdout View 4)"
    description: "Holdout view 4 metrics across all frames. Measures spatial generalization."
    source: per_view
    holdout_view: 4
    holdout_key: view_4

metrics:
  primary:
    - psnr_gt_masked
    - iou
  secondary:
    - psnr_intersection
    - coverage
    - ssim_gt_masked

visualization:
  sample_frames: [3240, 3360, 3480]
  img_size: 200
