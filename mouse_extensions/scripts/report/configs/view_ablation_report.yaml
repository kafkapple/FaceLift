title: "View Count Ablation — GS-LRM 1v-6v + Pose-Splatter (M5t2 Fair Eval)"

dataset:
  name: M5t2
  split: test (frames 3240-3599)
  total_views: 6
  resolution: 512
  gt_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  gt_pattern: "{fid}/images/cam_{vid:03d}.png"
  info: >
    View ablation: GS-LRM trained with N={1,2,3,4,5,6} input views.
    All models use base_uniform_v2 config, M5t2 dataset, L2 + Perceptual loss.
    Pose-Splatter: per-scene optimization baseline (50 epochs on same data).
    Fair eval: PSNR_gt (FG-masked), 360 test frames × 5 views = 1800 samples/config.

experiments:
  - name: "GS-LRM 1v"
    method: facelift
    pipeline: gslrm (1-view)
    input_views: 1
    metrics_json: experiments/comparison/tier/gslrm_1view_fair.json
    render_dir: outputs/tier_comparison/gslrm_1view_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#BBDEFB"

  - name: "GS-LRM 2v"
    method: facelift
    pipeline: gslrm (2-view)
    input_views: 2
    metrics_json: experiments/comparison/tier/gslrm_2view_fair.json
    render_dir: outputs/tier_comparison/gslrm_2view_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#64B5F6"

  - name: "GS-LRM 3v"
    method: facelift
    pipeline: gslrm (3-view)
    input_views: 3
    metrics_json: experiments/comparison/tier/gslrm_3view_fair.json
    render_dir: outputs/tier_comparison/gslrm_3view_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#42A5F5"

  - name: "GS-LRM 4v"
    method: facelift
    pipeline: gslrm (4-view)
    input_views: 4
    metrics_json: experiments/comparison/tier/gslrm_4view_fair.json
    render_dir: outputs/tier_comparison/gslrm_4view_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#1E88E5"

  - name: "GS-LRM 6v"
    method: facelift
    pipeline: gslrm (6-view)
    input_views: 6
    metrics_json: experiments/comparison/tier/gslrm_6view_fair.json
    render_dir: outputs/tier_comparison/gslrm_6view_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#0D47A1"

  - name: "PS 6-cam"
    method: pose-splatter
    pipeline: per-scene (50 epochs)
    input_views: 6
    metrics_json: experiments/comparison/tier/e3_pose_fair.json
    render_dir: outputs/tier_comparison/ps_m5_test/samples
    render_pattern: "{fid}/render_view_{vid:02d}.png"
    color: "#D32F2F"

protocols:
  a_temporal:
    name: "Protocol A: Temporal NVS (All Views)"
    description: >
      All 5 novel views (views 1-5) on 360 test frames.
      Measures temporal generalization to unseen timesteps.
    source: overall

metrics:
  primary:
    - psnr_gt_masked
    - iou
  secondary:
    - psnr_intersection
    - coverage
    - ssim_gt_masked

visualization:
  sample_frames: [3240, 3300, 3360, 3420, 3480, 3540]
  img_size: 180
  findings:
    - "Monotonic improvement: PSNR_gt 10.47 (1v) → 23.84 (6v), total gain +13.37 dB."
    - "1→2 views = largest jump: +5.48 dB, IoU 0.028→0.858 (monocular ambiguity resolved)."
    - "GS-LRM 2v (15.95 dB) already surpasses PS 6-cam (13.78 dB) by +2.17 dB."
    - "6v achieves lowest variance (σ=1.68) — consistent quality across all poses."
    - "E2E pipeline ceiling at ~8.2 dB due to MVDiffusion bottleneck (-15.64 dB from 6v GT)."
