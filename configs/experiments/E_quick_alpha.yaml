# E_quick_alpha: Quick test for mask_mode=gt
# Usage: train_gslrm.py -d D7_1 -e E_quick_alpha

_name: E_quick_alpha
_description: "Quick test for mask_mode=gt (500 steps)"

training:
  losses:
    mask_mode: gt              # L2 loss only on GT mask region
    alpha_loss_weight: 0.0     # No alpha supervision (independent)
  schedule:
    max_fwdbwd_passes: 500     # Quick test
    log_every: 50
    val_every: 500
    vis_every: 500

validation:
  enabled: false               # Skip validation for speed

wandb:
  enabled: false               # Skip wandb for quick test
