# =============================================================================
# Experiment: E3.3 Alpha Mask 4-View Fixed
# =============================================================================
# 4 input views, fixed selection, alpha mask
# =============================================================================

_name: E3_3_4v_alpha
_description: "Alpha mask with 4 views, fixed selection"

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: false

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.1
