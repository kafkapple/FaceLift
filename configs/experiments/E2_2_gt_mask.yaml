# =============================================================================
# Experiment: E2.2 GT Mask
# =============================================================================
# Hypothesis H2: Mask supervision improves boundary quality
# 4 views, fixed selection, GT mask supervision
# =============================================================================

_name: E2_2_gt_mask
_description: "Ground truth mask supervision"
_hypothesis: H2
_comparison_group: [E1_2, E2_2, E2_3]

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: false

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: gt
    alpha_loss_weight: 0.0

  logging:
    wandb:
      exp_name: null
