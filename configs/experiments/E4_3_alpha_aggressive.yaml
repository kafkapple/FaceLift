# E5.3: 5-View Alpha Aggressive (Shape Priority)
# Strong alpha supervision + opacity regularization
_name: E4_3_alpha_aggressive
_description: "Aggressive alpha settings for shape priority"

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 5
  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.5         # Strong alpha supervision
    alpha_loss_type: bce
    opacity_reg_weight: 0.01       # Opacity regularization
    opacity_reg_type: entropy
