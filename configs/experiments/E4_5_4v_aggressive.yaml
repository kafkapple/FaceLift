# =============================================================================
# Experiment: E5.5 Alpha Aggressive 4-View
# =============================================================================
# 4 input views, fixed selection, aggressive alpha settings
# =============================================================================

_name: E4_5_4v_aggressive
_description: "Aggressive alpha with 4 views"

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: false

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.5
    alpha_loss_type: bce
    opacity_reg_weight: 0.01
    opacity_reg_type: entropy
