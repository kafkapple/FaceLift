# =============================================================================
# E1_2_alpha + M4: GT Mask + Alpha + Object-Centered
# =============================================================================
# H1 Test: Variable PP with maximum coverage
# Combines:
# - E1_2_alpha: GT mask loss + alpha supervision
# - M4: Object-centered + PP correction

model:
  num_views: 6
  num_input_views: 4

training:
  dataset:
    random_view_selection: true

  losses:
    mask_mode: gt
    normalize_by_mask: true
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0
