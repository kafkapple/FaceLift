# E5.4: 4-View Alpha Conservative
# 4 input views with conservative alpha settings
_name: E4_4_4v_conservative
_description: "4-view conservative alpha settings"

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 4
  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.7
    alpha_loss_weight: 0.3
    alpha_loss_type: bce
