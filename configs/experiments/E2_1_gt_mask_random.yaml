# =============================================================================
# Experiment: E2.3b GT Mask 4-View Random
# =============================================================================
# 4 input views, random selection, GT mask supervision
# =============================================================================

_name: E2_1_gt_mask_random
_description: "GT mask with 4 views, random selection"

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: true

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: gt
    alpha_loss_weight: 0.0

  schedule:
    max_fwdbwd_passes: 500     # Quick test (was inheriting 15000)
