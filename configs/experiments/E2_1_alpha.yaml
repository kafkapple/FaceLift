# =============================================================================
# E2_1_alpha: Alpha Supervision Only (No Mask)
# =============================================================================
# mask_mode: none, alpha supervision만으로 형태 학습
# Reference: LGM (MSE alpha loss)

model:
  num_views: 6
  num_input_views: 4

training:
  dataset:
    random_view_selection: true

  losses:
    mask_mode: none
    normalize_by_mask: false
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0
