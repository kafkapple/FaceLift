# E2 variant: For native resolution datasets (D9, D9_norm)
# Reduced batch size due to higher memory requirements

training:
  dataloader:
    batch_size_per_gpu: 1  # Reduced from 2 due to 4.5x memory
    num_workers: 4         # Reduced to prevent OOM

  dataset:
    random_view_selection: true

  losses:
    mask_mode: gt
    alpha_loss_weight: 0.1
    alpha_loss_type: mse

model:
  image_tokenizer:
    image_size: 1024  # Native resolution (closest power of 2 to 1152)
