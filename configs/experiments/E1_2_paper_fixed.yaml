# =============================================================================
# Experiment: E1.2 Paper Baseline (Fixed)
# =============================================================================
# Hypothesis H1: Baseline control - fixed view selection
# 4 views, fixed selection, no mask supervision
# =============================================================================

_name: E1_2_paper_fixed
_description: "Paper baseline with fixed view selection"
_hypothesis: H1
_comparison_group: [E1_1, E1_2]

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: false

  losses:
    masked_pixelalign_loss: false
    masked_l2_loss: false
    masked_ssim_loss: false
    mask_mode: none
    alpha_loss_weight: 0.0

  logging:
    wandb:
      exp_name: null
