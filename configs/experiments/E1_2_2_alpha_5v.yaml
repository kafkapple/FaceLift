# =============================================================================
# E1_2_2_alpha_5v: E1_2_alpha + 5 View Input
# =============================================================================
# E1_2_alpha 변형: 5 input views, 1 holdout view

model:
  num_views: 6
  num_input_views: 5

training:
  dataset:
    random_view_selection: true

  losses:
    mask_mode: gt
    normalize_by_mask: true
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0
