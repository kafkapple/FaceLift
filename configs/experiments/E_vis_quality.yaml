# E_vis_quality.yaml - High-quality visualization (slow render, smooth video)
# Usage: torchrun ... -d M1 -e E_vis_quality

training:
  schedule:
    max_fwdbwd_passes: 1
    warmup: 0
  
  val_every: 1
  vis_every: 1
  
  dataloader:
    batch_size_per_gpu: 1
    num_workers: 2
  
  losses:
    alpha_loss_weight: 0.1
    mask_mode: "gt"

validation:
  batch_size: 1
  num_samples: 1

visualization:
  turntable:
    smooth_trajectory: true
    camera_order: [1, 3, 5, 0, 4, 2]
    loop: true
    
    # 180 views = 6 transitions × 30 frames
    # fps=5 → 전환당 6초, 총 36초 (매우 부드럽고 천천히)
    num_views: 180
    fps: 5
    
    grid_rows: 6
    grid_cols: 10              # 60 views for grid
    resolution: 384
    
    save_video: true
    save_dataset_views_video: true
    dataset_views_fps: 1       # 카메라당 1초 = 6초
