# =============================================================================
# Experiment: E4.2 5-View Alpha + Alpha Loss
# =============================================================================
# Hypothesis H4: Alpha loss improves boundary learning
# 5 views, fixed selection, alpha mask + explicit alpha loss
# =============================================================================

_name: E5_2_alpha_loss_only
_description: "5 input views with alpha mask and alpha loss"
_hypothesis: H4
_comparison_group: [E3_2, E4_2]

training:
  dataset:
    num_views: 6
    num_input_views: 5
    random_view_selection: false

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.1
    alpha_loss_type: bce

  logging:
    wandb:
      exp_name: null
