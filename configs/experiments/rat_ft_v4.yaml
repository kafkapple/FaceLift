# FAILED — clip_xyz=true clips Gaussians, IoU=0 at step 101. Superseded by rat_ft_v5.yaml
# Rat Fine-Tuning v4 (RAT2 despilled + convergence-point recentering + distance normalization)
# v3 failure: centroid recentering collapsed camera distances (2.6 → 0.4) → IoU=0 at step 700
# v4 fix: convergence point recentering (6.0→2.7, fx=605 preserved) + distance normalization
# After convergence recenter: cam dist ~6.0 (natural). Normalize to 2.7 WITHOUT fx scaling.
# Result: scene at origin, dist=2.7, fx=605 (10% off pretrained 549, fine-tunable).
# Rat appears ~2.2x larger in frame (coverage 1.5% → ~7%).
model:
  num_input_views: 6
  num_views: 6
mouse:
  recenter_cameras: true              # convergence point recentering (v4: ray intersection)
  target_camera_distance: 2.7         # CRITICAL: normalize to pretrained expectation
  scale_intrinsics_with_distance: false  # keep fx=605 (don't scale to 273)
  normalize_cameras: false            # same as v1 (avoid Z-up issues with rat data)
training:
  losses:
    alpha_loss_weight: 0.3
  dataloader:
    num_workers: 4
    prefetch_factor: 2
  schedule:
    max_fwdbwd_passes: 15000
    early_stop_patience: 2000         # NEW: abort if no improvement for 2000 steps
  optimizer:
    lr: 5e-5
  checkpointing:
    checkpoint_dir: /node_data/joon/checkpoints/FaceLift/gslrm/RAT2_despilled_rat_ft_v4
    resume_from: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_6view_alpha03_v3/best_psnr.pt
wandb:
  name: RAT2_despilled_rat_ft_v4
  tags:
  - rat
  - fine_tuning
  - alpha_0.3
  - 6view
  - sdannce
  - convergence_recenter
  - distance_norm
