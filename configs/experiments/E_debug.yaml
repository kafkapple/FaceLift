# E_debug.yaml - Minimal Debug (1 step, slow smooth video)
# Usage: torchrun ... -d M1 -e E_debug

training:
  schedule:
    max_fwdbwd_passes: 1
    warmup: 0
  
  val_every: 1
  vis_every: 1
  
  dataloader:
    batch_size_per_gpu: 1
    num_workers: 2
  
  losses:
    alpha_loss_weight: 0.1
    mask_mode: "gt"

validation:
  batch_size: 1
  num_samples: 1

visualization:
  turntable:
    smooth_trajectory: true
    camera_order: [0, 5, 3, 1, 2, 4]
    loop: true
    
    # 36 views = 6 transitions × 6 frames
    # fps=2 → 전환당 3초, 총 18초 (천천히)
    num_views: 36
    fps: 2
    
    grid_rows: 6
    grid_cols: 6
    resolution: 256
    
    save_video: true
    save_dataset_views_video: true
    dataset_views_fps: 1       # 카메라당 1초
