# E_debug.yaml - Minimal Debug (1 step)
# Usage: torchrun ... -d M1 -e E_debug

training:
  schedule:
    max_fwdbwd_passes: 1
    warmup: 0
  
  val_every: 1
  vis_every: 1
  
  dataloader:
    batch_size_per_gpu: 1
    num_workers: 2
  
  losses:
    alpha_loss_weight: 0.1
    mask_mode: "gt"

validation:
  batch_size: 1
  num_samples: 1

visualization:
  turntable:
    # Smooth trajectory between cameras
    smooth_trajectory: true
    camera_order: [1, 3, 5, 0, 4, 2]
    loop: true
    
    # Video settings - 20초 이상, 천천히
    num_views: 360             # 6 transitions × 60 frames = ~4초/transition
    fps: 10                    # 360/10 = 36초 총 길이
    
    # Grid settings
    grid_rows: 6
    grid_cols: 10              # 60 views for grid image
    resolution: 384
    
    # Save both videos
    save_video: true
    save_dataset_views_video: true  # NEW: 각 카메라 정적 뷰 영상
    dataset_views_fps: 2            # 카메라당 0.5초
