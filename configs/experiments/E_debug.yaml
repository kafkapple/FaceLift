# E_debug.yaml - Fast Debug Mode for Testing
# Usage: torchrun ... -d M1 -e E_debug
# Expected runtime: ~2-3 minutes

training:
  # ★ Correct path for max steps
  schedule:
    max_fwdbwd_passes: 50
    warmup: 5
  
  # Frequent validation (every 10 steps)
  val_every: 10
  
  # Frequent visualization
  vis_every: 10
  
  # Fast iteration
  dataloader:
    batch_size_per_gpu: 1
    num_workers: 2
  
  # Enable alpha loss to test visualization
  losses:
    alpha_loss_weight: 0.1
    alpha_loss_type: "mse"
    l2_loss_weight: 1.0
    perceptual_loss_weight: 0.5
    mask_mode: "gt"

# Smaller validation for speed
validation:
  batch_size: 1
  num_samples: 2
