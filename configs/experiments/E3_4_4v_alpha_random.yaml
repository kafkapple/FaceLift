# =============================================================================
# Experiment: E3.4 Alpha Mask 4-View Random
# =============================================================================
# 4 input views, random selection, alpha mask
# =============================================================================

_name: E3_4_4v_alpha_random
_description: "Alpha mask with 4 views, random selection"

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: true

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.1
