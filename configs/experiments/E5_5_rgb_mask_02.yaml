# =============================================================================
# Experiment: E5.5 RGB Mask - Threshold 0.2
# =============================================================================

_name: E5_5_rgb_mask_02
_description: "RGB-based mask with threshold 0.2, 4 input views"
_hypothesis: "H5.5: Stricter RGB threshold (0.2) for cleaner masks"
_comparison_group: [E5_4_rgb_mask_01]

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 4               # Paper setting

  losses:
    mask_mode: rgb_pred
    pred_mask_threshold: 0.2         # Stricter than 0.1
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    alpha_loss_weight: 0.3
    alpha_loss_type: bce
    background_loss_weight: 0.5
    opacity_reg_weight: 0.01
    opacity_reg_type: entropy

  logging:
    wandb:
      exp_name: null
