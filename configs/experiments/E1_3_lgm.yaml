# =============================================================================
# E1_3_lgm: LGM Style (Strong Alpha)
# =============================================================================
# GT mask + Full alpha supervision (1:1 ratio with RGB)
# Reference: LGM (ECCV 2024 Oral)

model:
  num_views: 6
  num_input_views: 4

training:
  dataset:
    random_view_selection: true

  losses:
    mask_mode: gt
    normalize_by_mask: true
    alpha_loss_weight: 1.0
    alpha_loss_type: mse
    bg_loss_weight: 0.0
