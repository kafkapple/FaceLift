# =============================================================================
# E1_2_3_alpha_fixed: E1_2_alpha + Fixed View Selection
# =============================================================================
# E1_2_alpha 변형: 고정 뷰 선택

model:
  num_views: 6
  num_input_views: 4

training:
  dataset:
    random_view_selection: false

  losses:
    mask_mode: gt
    normalize_by_mask: true
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0
