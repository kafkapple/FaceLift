# =============================================================================
# Experiment: E5.1 5-View Alpha Random
# =============================================================================
# Hypothesis H5: Random view selection with 5 views
# 5 views, random selection, alpha mask supervision
# =============================================================================

_name: E5_1_5v_alpha_random
_description: "5 input views with random selection and alpha mask"
_hypothesis: H5
_comparison_group: [E3_2, E5_1]

training:
  dataset:
    num_views: 6
    num_input_views: 5
    random_view_selection: true

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.0

  logging:
    wandb:
      exp_name: null
