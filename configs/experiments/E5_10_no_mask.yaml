# =============================================================================
# Experiment: E5.10 No Mask - Baseline without masking
# =============================================================================
# Reference for how model performs without mask-based losses
# Previous experiments showed fg_coverage=0.23 (best)
# =============================================================================

_name: E5_10_no_mask
_description: "No mask baseline, 4 input views"
_hypothesis: "H5.10: No mask avoids mask-related artifacts"
_comparison_group: [E5_9_gt_mask, E5_7_optimal_alpha]

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 4               # Paper setting

  losses:
    mask_mode: none
    masked_pixelalign_loss: false
    masked_l2_loss: false
    masked_ssim_loss: false
    alpha_loss_weight: 0.3           # Still learn boundaries
    alpha_loss_type: bce
    opacity_reg_weight: 0.01
    opacity_reg_type: entropy
    background_loss_weight: 1.0

  logging:
    wandb:
      exp_name: null
