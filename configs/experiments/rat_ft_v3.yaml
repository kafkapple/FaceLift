# Rat Fine-Tuning v3 (RAT2 despilled + camera recentering)
# Fix: add recenter_cameras to shift camera centroid to origin
# Without this, clip_xyz clips Gaussians to wrong region → corrupted 3D geometry
# v2 reached PSNR 18.67 but with distorted geometry; v3 should improve 3D quality
model:
  num_input_views: 6
  num_views: 6
mouse:
  recenter_cameras: true  # NEW: shift camera centroid to origin before model forward
training:
  losses:
    alpha_loss_weight: 0.3
  dataloader:
    num_workers: 4
    prefetch_factor: 2
  schedule:
    max_fwdbwd_passes: 15000
    early_stop_patience: 0
  optimizer:
    lr: 5e-5
  checkpointing:
    checkpoint_dir: /node_data/joon/checkpoints/FaceLift/gslrm/RAT2_despilled_rat_ft_v3
    resume_from: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_6view_alpha03_v3/best_psnr.pt
wandb:
  name: RAT2_despilled_rat_ft_v3
  tags:
  - rat
  - fine_tuning
  - alpha_0.3
  - 6view
  - sdannce
  - recenter_cameras
