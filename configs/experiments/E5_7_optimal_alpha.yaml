# =============================================================================
# Experiment: E5.7 Optimal Alpha (Consolidated Best Settings)
# =============================================================================
# Consolidates best findings from E4 series experiments:
# - alpha_loss_weight: 0.5 (30x IoU improvement over 0.1)
# - threshold: 0.5 (better shape learning than 0.7)
# - opacity_reg: 0.01 (reduces floaters)
# - 4 input views (paper setting)
# =============================================================================

_name: E5_7_optimal_alpha
_description: "Optimal alpha settings consolidated from ablation studies, 4 input views"
_hypothesis: "Consolidated best: alpha_loss=0.5, threshold=0.5, opacity_reg=0.01"
_comparison_group: [E5_4_rgb_mask_01, E5_6_alpha_thresh_07]

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 4               # Paper setting: train=4, eval=2

  losses:
    # Masked losses
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    
    # Alpha mask settings (optimized)
    mask_mode: alpha
    alpha_mask_threshold: 0.5        # Better shape (vs 0.7)
    alpha_loss_weight: 0.5           # Critical: 30x IoU improvement
    alpha_loss_type: bce
    
    # Regularization
    opacity_reg_weight: 0.01         # Reduce floaters
    opacity_reg_type: entropy

  logging:
    wandb:
      exp_name: null

visualization:
  turntable:
    save_video: true
    fps: 30
