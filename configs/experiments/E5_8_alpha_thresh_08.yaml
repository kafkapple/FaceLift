# =============================================================================
# Experiment: E5.8 Alpha Threshold 0.8 - Very Strict
# =============================================================================

_name: E5_8_alpha_thresh_08
_description: "Alpha mask with very strict threshold 0.8, 4 input views"
_hypothesis: "H5.8: Very strict threshold (0.8) for minimal background leakage"
_comparison_group: [E5_6_alpha_thresh_07]

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 4               # Paper setting

  losses:
    mask_mode: alpha
    alpha_mask_threshold: 0.8        # Very strict
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    alpha_loss_weight: 0.5
    alpha_loss_type: bce
    opacity_reg_weight: 0.03         # Stronger regularization
    opacity_reg_type: l1_sparse
    background_loss_weight: 1.0

  logging:
    wandb:
      exp_name: null
