# =============================================================================
# 6view_alpha05_err: 6-View + Alpha 0.5 + Effective Rank Regularization
# =============================================================================
# Goal: Penalize pancake (low-rank) Gaussians to improve 3D geometry quality.
# ERR encourages isotropic Gaussians by maximizing covariance entropy.
#
# Effective Rank concept:
#   erank = exp(H) where H = -sum(p_i * log(p_i)), p_i = s_i^2 / sum(s_j^2)
#   Range: [1, 3], pancake=1, sphere=3
#   Loss = mean(3 - erank) * weight
#
# Usage:
#   CUDA_VISIBLE_DEVICES=4 torchrun --standalone --nproc_per_node=1 \
#       train_gslrm.py -d M5t2 -e 6view_alpha05_err

model:
  num_views: 6
  num_input_views: 6

training:
  dataset:
    random_view_selection: true

  losses:
    mask_mode: gt
    normalize_by_mask: true
    alpha_loss_weight: 0.5
    alpha_loss_type: mse
    bg_loss_weight: 0.0
    effective_rank_weight: 0.01
    effective_rank_target: 3.0   # sphere = max isotropy
