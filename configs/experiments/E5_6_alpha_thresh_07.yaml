# =============================================================================
# Experiment: E5.6 Alpha Threshold 0.7 - Stricter threshold to reduce bleeding
# =============================================================================
# Hypothesis: Higher threshold (0.7 vs 0.5) reduces background false positives
# Expected: ghost_fg_coverage should decrease
# =============================================================================

_name: E5_6_alpha_thresh_07
_description: "Alpha mask with stricter threshold 0.7, 4 input views"
_hypothesis: "H5.6: Higher alpha threshold reduces Floating Gaussian impact"
_comparison_group: [E5_4_rgb_mask_01, E5_7_optimal_alpha]

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 4               # Paper setting: train=4, eval=2

  losses:
    mask_mode: alpha
    alpha_mask_threshold: 0.7        # Key change: 0.5 -> 0.7
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    
    # Alpha loss to learn better boundaries
    alpha_loss_weight: 0.5
    alpha_loss_type: bce
    
    # Stronger opacity regularization to suppress floaters
    opacity_reg_weight: 0.02         # Increased: 0.01 -> 0.02
    opacity_reg_type: l1_sparse      # Changed: entropy -> l1_sparse (pushes to 0/1)
    
    background_loss_weight: 1.0

  logging:
    wandb:
      exp_name: null

visualization:
  turntable:
    save_video: true
    fps: 30
