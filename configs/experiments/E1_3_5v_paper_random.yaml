# =============================================================================
# Experiment: E1.3 Paper Baseline 5-View Random
# =============================================================================
# 5 input views, random selection, NO mask
# =============================================================================

_name: E1_3_5v_paper_random
_description: "Paper baseline with 5 views, random selection"

training:
  dataset:
    num_views: 6
    num_input_views: 5
    random_view_selection: true

  losses:
    masked_pixelalign_loss: false
    masked_l2_loss: false
    masked_ssim_loss: false
    mask_mode: none
    alpha_loss_weight: 0.0
