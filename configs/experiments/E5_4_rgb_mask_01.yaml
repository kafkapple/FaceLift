# =============================================================================
# Experiment: E5.4 RGB Mask - Threshold 0.1
# =============================================================================
# RGB-based mask: detects foreground by color distance from white background
# More stable than alpha mask (does not depend on rendered_alpha quality)
# =============================================================================

_name: E5_4_rgb_mask_01
_description: "RGB-based mask with threshold 0.1, 4 input views"
_hypothesis: "H5.4: RGB mask is more stable than alpha mask"
_comparison_group: [E5_6_alpha_thresh_07, E5_9_gt_mask]

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 4               # Paper setting: train=4, eval=2

  losses:
    mask_mode: rgb_pred              # RGB-based mask
    pred_mask_threshold: 0.1         # distance from white (1.0)
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    
    # Alpha loss still helps boundary learning
    alpha_loss_weight: 0.3
    alpha_loss_type: bce
    
    background_loss_weight: 0.5
    
    # Opacity regularization
    opacity_reg_weight: 0.01
    opacity_reg_type: entropy

  logging:
    wandb:
      exp_name: null

visualization:
  turntable:
    save_video: true
    fps: 30
