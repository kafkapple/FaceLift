# E5.2: 5-View Alpha Conservative (Anti-Background-Bleeding)
# Higher threshold + stronger alpha loss
_name: E4_2_alpha_conservative
_description: "Conservative alpha settings to prevent background bleeding"

training:
  dataset:
    random_view_selection: false
    num_views: 6
    num_input_views: 5
  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.7      # Higher threshold (0.5 -> 0.7)
    alpha_loss_weight: 0.3         # Stronger alpha supervision (0.1 -> 0.3)
    alpha_loss_type: bce
