# =============================================================================
# Experiment: E2.5 GT Mask 5-View Random
# =============================================================================
# 5 input views, random selection, GT mask supervision
# =============================================================================

_name: E2_5_5v_gt_random
_description: "GT mask with 5 views, random selection"

training:
  dataset:
    num_views: 6
    num_input_views: 5
    random_view_selection: true

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: gt
    alpha_loss_weight: 0.0
