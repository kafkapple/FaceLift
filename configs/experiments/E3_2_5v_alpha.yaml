# =============================================================================
# Experiment: E3.2 5-View Alpha
# =============================================================================
# Hypothesis H3: More input views improve reconstruction quality
# 5 views, fixed selection, alpha mask supervision
# =============================================================================

_name: E3_2_5v_alpha
_description: "5 input views with alpha mask"
_hypothesis: H3
_comparison_group: [E2_3, E3_2]

training:
  dataset:
    num_views: 6
    num_input_views: 5
    random_view_selection: false

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.0

  logging:
    wandb:
      exp_name: null
