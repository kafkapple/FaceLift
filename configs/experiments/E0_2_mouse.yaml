# =============================================================================
# E0_2_mouse: Mouse-adapted Baseline
# =============================================================================
# E0_1_facelift 기반 + Mouse 데이터 특화 조정
# - lr: 1e-5 (finetuning)
# - grad_clip_norm: 5.0

model:
  num_views: 6
  num_input_views: 4

training:
  dataset:
    maximize_view_overlap: false
    random_view_selection: true

  optimizer:
    lr: 0.00001
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05

  runtime:
    grad_clip_norm: 5.0

  losses:
    mask_mode: none
    alpha_loss_weight: 0.0
    bg_loss_weight: 0.0
