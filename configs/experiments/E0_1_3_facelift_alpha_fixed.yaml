# =============================================================================
# E0_1_3_facelift_alpha_fixed: FaceLift + Alpha + Fixed View
# =============================================================================
# E0_1_facelift 변형: alpha loss + 고정 뷰 선택

model:
  num_views: 6
  num_input_views: 4

training:
  dataset:
    random_view_selection: false

  losses:
    mask_mode: none
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0
