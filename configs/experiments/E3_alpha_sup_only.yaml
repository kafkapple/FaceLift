# =============================================================================
# E3: Alpha Supervision Only (mask_mode: none + alpha_loss)
# =============================================================================
# Literature: LGM (ECCV 2024)
# Purpose: Shape convergence without RGB masking
# =============================================================================

_name: E3_alpha_sup_only
_description: "Alpha supervision only (LGM style)"
_mask_mode: alpha_sup_only

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: true

  losses:
    # No RGB masking
    mask_mode: none
    normalize_by_mask: false
    
    # Alpha supervision (LGM)
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    
    # No background penalty
    bg_loss_weight: 0.0
    
    # Standard losses
    l2_loss_weight: 1.0
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.0
