# =============================================================================
# Experiment: E4.3 Alpha Loss 4-View Fixed
# =============================================================================
# 4 input views, fixed selection, alpha loss supervision
# =============================================================================

_name: E5_3_4v_alpha_loss
_description: "Alpha loss with 4 views, fixed selection"

training:
  dataset:
    num_views: 6
    num_input_views: 4
    random_view_selection: false

  losses:
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.3
    alpha_loss_type: bce
