# GS-LRM View Ablation: 3 Input Views
# Compare with baseline (4 views)

_target_: gslrm.model.gslrm.GSLRM

# View configuration
num_input_views: 3     # CHANGED: 4 → 3
num_views: 6           # Total views (unchanged)
random_view_selection: true

# Training
training:
  max_steps: 10000
  val_every: 200
  save_every: 1000
  
  loss:
    l2_weight: 1.0
    perceptual_weight: 0.5
    
# Dataset - M5t2
dataset:
  name: mouse_M5t2
  train_list: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_train.txt
  val_list: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_val.txt
  
# Output
output_dir: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_3view
wandb:
  project: FaceLift-Mouse
  name: gslrm_M5t2_3view
