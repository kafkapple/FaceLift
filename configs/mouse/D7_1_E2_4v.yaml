# D7_1 + E2: GT + Alpha Supervision (4 views)
_base_:
  - ../base/gslrm_base.yaml
  - ../datasets/D7_1.yaml
  - ../experiments/E2_gt_alpha_sup.yaml

experiment:
  name: D7_1_E2_4v
  description: "D7_1 GT + Alpha Supervision (4 views)"

training:
  dataset:
    num_input_views: 3  # 3 input + 1 target = 4

  checkpointing:
    checkpoint_dir: checkpoints/gslrm/D7_1_E2_4v

  logging:
    wandb:
      exp_name: D7_1_E2_4v
      group: D7_1_mask
      job_type: E2_gt_alpha_sup_4v

validation:
  output_dir: experiments/validation/D7_1_E2_4v

inference:
  output_dir: experiments/inference/D7_1_E2_4v
