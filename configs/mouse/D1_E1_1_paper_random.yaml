# D1 Baseline: PP-centered crop (problematic preprocessing)
# Each view has different crop offset -> cross-view inconsistency -> ghosting
profile: false
debug: false
model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true
training:
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 1
    grad_clip_norm: 50.0
    grad_checkpoint_every: 1
  dataset:
    dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D1_pp_centered/data_mouse_train.txt
    maximize_view_overlap: false
    random_view_selection: true
    num_views: 6
    num_input_views: 4
    target_has_input: true
    normalize_distance_to: 0.0
    remove_alpha: false
    background_color: white
  dataloader:
    batch_size_per_gpu: 2
    num_workers: 8
    num_threads: 16
    prefetch_factor: 8
  losses:
    l2_loss_weight: 1.0
    lpips_loss_weight: 0.0
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.0
    pixelalign_loss_weight: 0.0
    masked_pixelalign_loss: false
    masked_l2_loss: false
    masked_ssim_loss: false
    pointsdist_loss_weight: 0.0
    warmup_pointsdist: false
  optimizer:
    lr: 4.0e-4
    weight_decay: 0.05
  scheduler:
    type: cosine
    warmup_iters: 200
    min_lr_ratio: 0.01
  misc:
    max_steps: 5000
    val_every: 200
    vis_every: 100
    save_every: 1000
    turntable_every: 500
validation:
  dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D1_pp_centered/data_mouse_val.txt
checkpoints:
  load_pretrained: checkpoints/gslrm.ckpt
  save_dir: checkpoints/gslrm/D1_E1_1_paper_random
wandb:
  project: FaceLift-Mouse
  name: D1_E1_1_paper_random
  enabled: true
  vis_every: 100
