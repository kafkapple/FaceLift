# ============================================================================
# Mouse GS-LRM Baseline + Alpha Mask
#
# 원 논문 설정 + Alpha mask만 적용
# 다른 설정은 baseline과 동일 (lr=1e-4, views=3, etc.)
#
# 변경점 (vs baseline):
#   - use_rendered_alpha_mask: true
#   - masked_l2_loss: true (alpha mask 적용)
#   - masked_ssim_loss: true
#
# 목적: Alpha mask 효과만 분리 검증
# ============================================================================

profile: false
debug: false

model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true

training:
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 1
    grad_clip_norm: 1.0
    grad_checkpoint_every: 1

  dataset:
    dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/data_mouse_v11_full/data_mouse_train.txt
    maximize_view_overlap: true
    num_views: 6
    num_input_views: 3
    target_has_input: true
    normalize_distance_to: 0.0
    remove_alpha: false
    background_color: white
    random_view_selection: true

  dataloader:
    batch_size_per_gpu: 2
    num_workers: 4
    num_threads: 32
    prefetch_factor: 32

  losses:
    l2_loss_weight: 1.0
    lpips_loss_weight: 0.0
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.0
    pixelalign_loss_weight: 0.0
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    background_loss_weight: 0.0
    pointsdist_loss_weight: 0.0
    warmup_pointsdist: false
    distill_loss_weight: 0.0
    clamp_rendering: true
    use_predicted_mask: false
    use_rendered_alpha_mask: true

  optimizer:
    lr: 1.0e-04
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
    reset_lr: false
    reset_weight_decay: false
    reset_training_state: true

  schedule:
    num_epochs: 50000
    early_stop_after_epochs: 50000
    max_fwdbwd_passes: 20000
    warmup: 500
    l2_warmup_steps: 500

  checkpointing:
    checkpoint_dir: checkpoints/mouse_gslrm_baseline_alpha
    checkpoint_every: 100
    resume_ckpt: checkpoints/gslrm/ckpt_0000000000021125.pt

  logging:
    print_every: 10
    vis_every: 100
    wandb:
      project: mouse_facelift
      group: gslrm
      job_type: finetune
      exp_name: mouse_gslrm_baseline_alpha_mask
      log_every: 10
      offline: false

mouse:
  use_mouse_dataset: true
  normalize_cameras: false
  target_camera_distance: 0.0
  normalize_to_z_up: true
  auto_generate_mask: false
  mask_threshold: 250
  augmentation:
    enabled: false

validation:
  enabled: true
  dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/data_mouse_v11_full/data_mouse_val.txt
  output_dir: experiments/validation/mouse_gslrm_baseline_alpha
  val_every: 100

inference:
  enabled: false
  output_dir: experiments/inference/mouse_gslrm_baseline_alpha
