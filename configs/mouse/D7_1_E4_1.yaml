    bg_loss_weight: 0.5

validation:
  data_list: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_val.txt

wandb:
  name: D7_1_E4_1
  tags: [D7_1, E4, bg_penalty, 5v, random]
