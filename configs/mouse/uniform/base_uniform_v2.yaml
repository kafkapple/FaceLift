# =============================================================================
# Uniform Experiment Base Config v2.1 (Complete)
# =============================================================================
# Based on gslrm_mouse.yaml with View Ablation specific settings
# All experiments MUST use this as base for fair comparison
# Created: 2026-02-06, Updated: 2026-02-07
# =============================================================================

profile: false
debug: false

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true

  # View configuration (MUST override num_input_views in experiment config)
  num_views: 6           # Total views for target rendering
  num_input_views: 4     # Default, override per experiment

# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  # Runtime settings
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 1
    grad_clip_norm: 1.0
    grad_checkpoint_every: 1
    allowed_gradnorm_factor: 20
    seed: 42              # UNIFORM: Fixed seed for reproducibility

  # Dataloader settings
  dataloader:
    batch_size_per_gpu: 2
    num_workers: 8
    num_threads: 16
    prefetch_factor: 8

  # Dataset settings
  dataset:
    dataset_path: ~/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_train.txt
    background_color: white
    maximize_view_overlap: false
    target_has_input: true
    normalize_distance_to: 0.0
    remove_alpha: false
    random_view_selection: true   # UNIFORM: Always true for training
    exclude_camera_indices: []
    # include_camera_indices: null

  # Loss settings
  losses:
    l2_loss_weight: 1.0
    lpips_loss_weight: 0.05
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.1
    pixelalign_loss_weight: 0.0
    pointsdist_loss_weight: 0.0
    warmup_pointsdist: false
    distill_loss_weight: 0.0
    opacity_reg_weight: 0.0
    opacity_reg_type: entropy
    clamp_rendering: true
    alpha_loss_weight: 0.0
    mask_mode: none

  # Optimizer settings
  optimizer:
    lr: 1.0e-06
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
    reset_lr: true
    reset_weight_decay: false
    reset_training_state: true

  # Schedule settings - UNIFORM for View Ablation
  schedule:
    num_epochs: 50000           # Used by get_job_overview() to compute num_fwdbwd_passes
    early_stop_after_epochs: 50000
    max_fwdbwd_passes: 15000    # Actual stop condition. Rounded up to 11 epochs (15840) by +1 in get_job_overview()
    max_steps: 10000            # ⚠️ DEAD CONFIG: not read by train_gslrm.py (uses max_fwdbwd_passes only)
    warmup: 500
    l2_warmup_steps: 500
    early_stop_patience: 0      # Disabled (use fixed steps)
    val_every: 100              # ⚠️ DEAD CONFIG: code reads validation.val_every, not this
    vis_every: 500              # ⚠️ DEAD CONFIG: code reads training.logging.vis_every, not this

  # Checkpointing settings
  checkpointing:
    checkpoint_every: 500
    checkpoint_dir: null        # MUST override in experiment config
    resume_ckpt: checkpoints/gslrm/ckpt_0000000000021125.pt

  # Logging settings
  logging:
    print_every: 50
    vis_every: 500
    wandb:
      group: view_ablation_v2
      job_type: train
      exp_name: null
      project: FaceLift-Mouse
      log_every: 10
      offline: false

# -----------------------------------------------------------------------------
# Mouse-specific settings
# -----------------------------------------------------------------------------
mouse:
  use_mouse_dataset: true
  normalize_cameras: false
  target_camera_distance: 0.0
  normalize_to_z_up: true
  auto_generate_mask: false
  mask_threshold: 250
  pp_correction: none
  augmentation:
    enabled: false

# -----------------------------------------------------------------------------
# Visualization settings
# -----------------------------------------------------------------------------
visualization:
  turntable:
    smooth_trajectory: true
    camera_order: [0, 4, 2, 1, 3, 5]
    angle_proportional_frames: false
    loop: true
    hold_frames: 15
    trajectory_fps: 10
    save_orbit_turntable: true
    orbit_views: 120
    orbit_fps: 15
    num_views: 144
    video_views: 144
    resolution: null
    elevation: 20
    radius: 2.7
    grid_rows: 6
    grid_cols: 6
    save_video: true
    save_dataset_views: false
    save_dataset_views_video: false
    inference_views: 150
    inference_resolution: null
    fps: 30

# -----------------------------------------------------------------------------
# Validation settings
# -----------------------------------------------------------------------------
validation:
  enabled: true
  val_every: 100
  visual_first_batch: true
  dataset_path: ~/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_val.txt
  target_has_input: true

# -----------------------------------------------------------------------------
# Test settings
# -----------------------------------------------------------------------------
test:
  dataset_path: ~/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_test.txt

# -----------------------------------------------------------------------------
# Inference settings
# -----------------------------------------------------------------------------
inference:
  enabled: false

# -----------------------------------------------------------------------------
# WandB tags
# -----------------------------------------------------------------------------
wandb:
  project: FaceLift-Mouse
  tags:
    - uniform_v2
    - M5t2
    - 15k_fwdbwd_passes
    - seed42
