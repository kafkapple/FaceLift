# 2-view FIXED widest (cam[0,1] @ 177.3° antipodal), seed 42
# Phase 1 methodology validation (260408). Baseline comparison: 2view_v2 (random).
# Purpose: Measure information leakage from random_view_selection=true.
model:
  num_input_views: 2
training:
  optimizer:
    lr: 1.0e-07   # LR patch 260410: 1e-6 caused collapse at s1201. 10x reduction.
  runtime:
    seed: 42
  dataloader:
    num_workers: 4
    prefetch_factor: 2
  dataset:
    random_view_selection: false
    num_input_views: 2
    fixed_input_indices: [0, 1]
  checkpointing:
    checkpoint_dir: /node_data/joon/checkpoints/FaceLift/gslrm/uniform_v2/2view_fixed_widest_s1
wandb:
  name: uniform_v2_2view_fixed_widest_s1
  tags:
  - uniform_v2
  - M5t2
  - methodology_validation_260408
  - seed42
  - 2view
  - fixed_views
  - widest_177deg
