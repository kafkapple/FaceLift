# D7_1_E2_1_fixed: GT Mask + Alpha Supervision (fixed views)
# SubNum: 1 (5v) + _fixed suffix

_base_:
  - ../gslrm_base.yaml

training:
  dataset:
    data_list: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_train.txt
    num_views: 6
    num_input_views: 5
    random_view_selection: false

  losses:
    mask_mode: gt
    normalize_by_mask: true
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0

validation:
  data_list: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_val.txt

wandb:
  name: D7_1_E2_1_fixed
  tags: [D7_1, E2, gt_alpha, 5v, fixed]
