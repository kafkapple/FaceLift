# ============================================================================
# Mouse GS-LRM: Recommended Configuration
#
# 기반: v23 (V11 PP-Centered Dataset)
# 특징: cx=cy=256 정확+일관, Ray direction 기하학적으로 정확
#
# 사용법:
#   python train_gslrm.py --config configs/mouse/gslrm_recommended.yaml
# ============================================================================

profile: false
debug: false

# ============================================================================
# Model (원본 FaceLift와 동일)
# ============================================================================
model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true

# ============================================================================
# Training
# ============================================================================
training:
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 2
    grad_clip_norm: 50.0
    grad_checkpoint_every: 1

  # Dataset: 경로를 실제 데이터 위치로 수정하세요
  dataset:
    dataset_path: data_mouse_train.txt  # TODO: 실제 경로로 수정
    maximize_view_overlap: false
    num_views: 6
    num_input_views: 5
    target_has_input: true
    normalize_distance_to: 0.0
    remove_alpha: false
    background_color: white

  dataloader:
    batch_size_per_gpu: 2
    num_workers: 8
    num_threads: 16
    prefetch_factor: 8

  losses:
    l2_loss_weight: 1.0
    lpips_loss_weight: 0.0
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.0
    pixelalign_loss_weight: 0.0
    masked_pixelalign_loss: true
    masked_l2_loss: true
    masked_ssim_loss: true
    background_loss_weight: 1.0
    pointsdist_loss_weight: 0.0
    warmup_pointsdist: false
    distill_loss_weight: 0.0
    clamp_rendering: true

  optimizer:
    lr: 1.0e-06
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
    reset_lr: true
    reset_weight_decay: false
    reset_training_state: true

  schedule:
    num_epochs: 50000
    early_stop_after_epochs: 50000
    max_fwdbwd_passes: 10000
    warmup: 500
    l2_warmup_steps: 500

  checkpointing:
    checkpoint_dir: checkpoints/mouse_gslrm
    checkpoint_every: 100
    resume_ckpt: checkpoints/gslrm/ckpt_0000000000021125.pt

  logging:
    print_every: 10
    vis_every: 100
    wandb:
      project: mouse_facelift
      group: gslrm
      job_type: finetune
      exp_name: mouse_gslrm_recommended
      log_every: 10
      offline: false

# ============================================================================
# Mouse-Specific Settings
# ============================================================================
mouse:
  use_mouse_dataset: true
  random_view_selection: true
  normalize_cameras: false
  target_camera_distance: 0.0
  normalize_to_z_up: true
  auto_generate_mask: false
  mask_threshold: 250
  augmentation:
    enabled: false

# ============================================================================
# Validation
# ============================================================================
validation:
  enabled: true
  dataset_path: data_mouse_val.txt  # TODO: 실제 경로로 수정
  output_dir: experiments/validation/mouse_gslrm
  val_every: 200

# ============================================================================
# Inference
# ============================================================================
inference:
  enabled: false
  output_dir: experiments/inference/mouse_gslrm
