# D7_1_E2_1: GT Mask + Alpha Supervision ⭐ RECOMMENDED - P0
# Dataset: D7.1 (Individual scale, geometric correction)
# Experiment: E2 (GT mask + alpha supervision)
# SubNum: 1 (5v, random)
# Reference: LGM + Pose Splatter combined

_base_:
  - ../gslrm_base.yaml

training:
  dataset:
    data_list: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_train.txt
    num_views: 6
    num_input_views: 5
    random_view_selection: true

  losses:
    mask_mode: gt
    normalize_by_mask: true
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0

validation:
  data_list: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_val.txt

wandb:
  name: D7_1_E2_1
  tags: [D7_1, E2, gt_alpha, 5v, random, recommended]
