training:
  dataset:
    dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/M3_persample/data_mouse_train.txt

validation:
  enabled: true
  dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/M3_persample/data_mouse_val.txt
  val_every: 200

inference:
  enabled: false
