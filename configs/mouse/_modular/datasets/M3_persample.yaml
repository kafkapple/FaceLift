# NOTE: This config requires M3_persample preprocessing to be completed first!
# Hypothesis H5: Variable zoom improves generalization

_dataset:
  name: M3_persample
  description: "Per-sample adaptive zoom, fx=549 normalized, PP accurate"
  path: /home/joon/data/preprocessed/FaceLift_mouse/M3_persample
  split: "90:10 (train:val)"
