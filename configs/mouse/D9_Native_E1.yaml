# D9-Native: Original Resolution Training (RTX A6000 Optimized)
#
# Key settings:
# - Resolution: 1152x1024 (original, no resize)
# - fx: ~1600 (original, not normalized to 549)
# - Memory optimized for RTX A6000 (48GB)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --standalone --nproc_per_node=1 #       train_gslrm.py --config configs/mouse/D9_Native_E1.yaml

_name: D9_Native_E1
_base: configs/base.yaml

# =============================================================================
# DATA
# =============================================================================
data:
  name: FaceLift_mouse_D9
  root: /home/joon/data/preprocessed/FaceLift_mouse/D9
  train_list: data_mouse_train.txt
  val_list: data_mouse_val.txt
  
  # Original resolution (NO resize)
  image_width: 1152
  image_height: 1024

# =============================================================================
# TRAINING (Memory Optimized for A6000)
# =============================================================================
training:
  # Memory optimization: batch=1, grad_accum=2 -> effective batch=2
  batch_size_per_gpu: 1
  grad_accum_steps: 2
  
  # Activation checkpointing
  grad_checkpoint_every: 1
  
  # Mixed precision
  use_amp: true
  amp_dtype: bf16
  
  # DDP
  find_unused_parameters: false
  
  # Dataset
  dataset:
    num_views: 6
    num_input_views: 4
  
  # Losses (baseline settings)
  losses:
    mask_mode: alpha
    alpha_mask_threshold: 0.5
    masked_l2_loss: false
    background_loss: 0.0
    opacity_reg_weight: 0.0
  
  # Optimizer
  optimizer:
    type: AdamW
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
  
  # Scheduler
  scheduler:
    type: cosine
    warmup_steps: 3000
    min_lr_ratio: 0.1
  
  # Schedule
  max_steps: 50000
  val_every: 500
  save_every: 5000
  vis_every: 1000
  log_every: 50

# =============================================================================
# VISUALIZATION
# =============================================================================
visualization:
  turntable:
    num_views: 64
    resolution: 384
    elevation: 15
    save_video: true
    fps: 30
