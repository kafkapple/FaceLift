# Cinematic Demo v8 Test — Camera transition fixes
# Changes from v6_C:
#   1. GT 6view opener: temporal (not static) + longer
#   2. Turntable: longer transition (40f), spherical sweep from GT position
#   3. ALL crossfade disabled (no_crossfade: true everywhere)
#   4. flow_novel_extra REMOVED
#   5. flow_gt_zoom_out: foreground-only (raw: false → composited on white bg)

global:
  fps: 30
  resolution: 768
  bg_color: [1.0, 1.0, 1.0]
  n_filter: 2
  gt_view: 0
  crossfade: 0.0         # Global crossfade disabled
  mask_border_color: null
  keypoint_overlay: false
  show_controls: false

model:
  config: configs/base/gslrm_mouse.yaml
  num_input_views: 6
  checkpoint: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_6view_alpha03_v3/best_psnr.pt
  m5_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  kp_path: ~/data/results/MAMMAL_mouse/v012345_kp22_20260126/keypoints_22_3d.npz

camera:
  radius: 2.7
  hfov: 50

frame_range: "1500:1860"

segments:
  # === Phase 0: GT 6-cam opener (temporal, not static) → zoom to cam 0 ===
  - type: flow_gt_opener
    duration: 5.0          # Longer (was 3.0) — more time for temporal GT mosaic
    frame_step: 2
    no_crossfade: true
    label: ""

  # === Phase 1: GT single view ===
  - type: flow_gt
    duration: 3.0
    raw: true
    frame_step: 2
    no_crossfade: true
    label: "GT RGB (Camera 0)"

  - type: flow_mask
    duration: 2.5
    frame_step: 2
    no_crossfade: true
    label: "Foreground Segmentation (SAM2)"

  - type: flow_render
    duration: 8.0
    frame_step: 2
    no_crossfade: true
    label: "GS-LRM 6v | alpha=0.3 checkpoint"

  # === Phase 2: 360 Turntable (longer transition for smooth GT→orbit) ===
  - type: freeze_orbit
    duration: 12.0          # Longer (was 10) to accommodate longer transition
    elevation: 20
    match_gt: false
    transition_frames: 40   # Longer (was 20) — more gradual elevation/radius sweep
    no_crossfade: true
    label: "360-degree Turntable"

  # === Phase 3: Bottom view ===
  - type: flow_novel
    duration: 6.0
    elevation: -80
    use_prev_azimuth: true
    prev_elevation: 20
    transition_frames: 30
    no_crossfade: true
    frame_step: 2
    label: "Bottom View - Temporal Sequence"

  # === Phase 4: Head close-up + Keypoints ===
  - type: flow_head_kp
    duration: 9.0
    elevation: 25
    zoom: 1.0
    prev_elevation: -80
    transition_frames: 30
    no_crossfade: true
    frame_step: 2
    label: "Head + Keypoints (Temporal)"

  # === Phase 5: flow_novel_extra REMOVED (per user request) ===

  # === Phase 6: GT 6-view zoom-out (FG-only, white background) ===
  - type: flow_gt_zoom_out
    duration: 5.0
    frame_step: 1
    no_crossfade: true
    fg_only: true           # NEW: foreground-only rendering on white bg
    label: "GT Views (6 Cameras) — Foreground"

  # === Phase 7: 6 fixed novel views grid ===
  - type: grid_novel_6views
    duration: 8.0
    frame_step: 2
    no_crossfade: true
    label: "Novel Views (6 Angles)"
