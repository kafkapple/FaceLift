# Cinematic v11 Production (768px, 30fps)
# SSOT: docs/specs/CINEMATIC_V11_SPEC.md

global:
  fps: 20
  resolution: 768
  bg_color: [1.0, 1.0, 1.0]
  n_filter: 2
  gt_view: 0
  crossfade: 0.3
  mask_border_color: null
  keypoint_overlay: false
  show_controls: false

model:
  config: configs/base/gslrm_mouse.yaml
  num_input_views: 6
  checkpoint: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_6view_alpha03_v3/best_psnr.pt
  m5_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  kp_path: ~/data/results/MAMMAL_mouse/v012345_kp22_20260126/keypoints_22_3d.npz

camera:
  radius: 2.7
  hfov: 50

frame_range: "1900:2260"

# KP visualization overrides
keypoint:
  kp_radius: 4
  bone_width: 2
  depth_alpha_min: 0.25
  depth_alpha_max: 0.80

segments:
  # === Act 1: Input & Pipeline (0:00 – 0:12.5) ===

  # Seg 0: GT 6-cam temporal mosaic (pure, no transition)
  - type: flow_gt_opener
    duration: 3.0
    mosaic_ratio: 1.0
    no_crossfade: true
    label: ""

  # Seg 1: Crop-zoom from 6-cam mosaic → Camera 0
  - type: flow_gt_opener
    duration: 2.0
    mosaic_ratio: 0.0
    no_crossfade: true
    label: ""

  # Seg 2: GT RGB single view
  - type: flow_gt
    duration: 2.0
    raw: true
    no_crossfade: true
    label: "GT RGB (Camera 0)"

  # Seg 3: FG segmentation overlay
  - type: flow_mask
    duration: 1.5
    no_crossfade: true
    label: "FG Segmentation (SAM2)"

  # Seg 4: GS-LRM splatting reconstruction
  - type: flow_render
    duration: 4.0
    no_crossfade: true
    label: "GS-LRM Reconstruction (6 Cameras)"

  # === Act 2: 3D Exploration (0:12.5 – 0:33.5) ===

  # Seg 5: 360-deg frozen-time orbit (1.5x slower, match GT elevation)
  - type: freeze_orbit
    duration: 9.0
    match_gt: true
    transition_frames: 10
    no_crossfade: true
    label: "360-deg Orbit (Frozen Time)"

  # Seg 6: Bottom view — render only
  - type: flow_novel
    duration: 3.0
    elevation: -80
    use_prev_azimuth: true
    prev_elevation: 20
    transition_frames: 15
    no_crossfade: true
    keypoint_overlay: false
    label: "Novel View (Bottom, -80deg)"

  # Seg 7: Bottom view + 4 paw KP with labels
  - type: flow_novel
    duration: 3.0
    elevation: -80
    use_prev_azimuth: true
    prev_elevation: -80
    transition_frames: 0
    no_crossfade: true
    keypoint_overlay: true
    kp_filter: [8, 12, 16, 19]
    show_kp_labels: true
    label: "Novel View (Bottom) + Paw Keypoints"

  # Seg 8: Progressive body part reveal + all 22 KP
  - type: flow_head_kp
    duration: 7.5
    elevation: 25
    zoom: 1.0
    prev_elevation: -80
    transition_frames: 15
    no_crossfade: true
    label: "Body Parts + All Keypoints"

  # Seg 9: Temporal orbit (time + rotation)
  - type: freeze_orbit
    duration: 7.5
    elevation: 20
    temporal: true
    transition_frames: 10
    no_crossfade: true
    label: "Temporal Orbit (Time+Rotation)"

  # === Act 3: Comparison & Novel Views (0:33.5 – 0:57) ===

  # Seg 10: GS-LRM render at 6 GT cameras (zoom + fade + static hold)
  - type: flow_render_mosaic
    duration: 6.0
    no_crossfade: true
    label: "GS-LRM Reconstruction (6 Cameras)"

  # Seg 11: 6 extrapolated novel views (3×2 grid)
  - type: grid_novel_6views
    duration: 4.0
    no_crossfade: true
    zoom_out: true
    zoom_ratio: 0.2
    label: "Extrapolated Novel Views"

  # Seg 12: Dense 6×6 turntable grid (fade-in, static end)
  - type: grid_novel_dense
    duration: 6.0
    rows: 6
    cols: 6
    elevations: [80, 40, 20, -20, -60, -85]
    start_azimuth: 0
    zoom_out: false
    zoom_in: false
    cell_resolution: 256
    no_crossfade: false
    label: "Turntable Grid (36 Views)"
