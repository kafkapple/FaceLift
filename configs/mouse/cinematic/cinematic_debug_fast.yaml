# Cinematic Debug v9 — Fast PoC testing (512px, 15fps)
# ~30-40min total vs ~4.5h at production settings
# Use for: camera transition testing, segment order verification, quick iteration
# Production: cinematic_demo_v6_C.yaml (768px, 30fps, frame_step=2)

global:
  fps: 15              # Half of production (30)
  resolution: 512      # GS-LRM native (vs 768 production) — 8.5x faster inference
  bg_color: [1.0, 1.0, 1.0]
  n_filter: 2
  gt_view: 0
  crossfade: 0.0       # No crossfade for clean transition testing
  mask_border_color: null
  keypoint_overlay: false
  show_controls: false

model:
  config: configs/base/gslrm_mouse.yaml
  num_input_views: 6
  checkpoint: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_6view_alpha03_v3/best_psnr.pt
  m5_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  kp_path: ~/data/results/MAMMAL_mouse/v012345_kp22_20260126/keypoints_22_3d.npz

camera:
  radius: 2.7
  hfov: 50

frame_range: "1500:1860"

segments:
  # === Phase 0: GT 6-cam temporal opener → zoom to cam 0 ===
  - type: flow_gt_opener
    duration: 3.0
    frame_step: 1         # Every frame for smooth movement from start
    mosaic_ratio: 0.3     # 30% mosaic, 70% zoom-in (less static time)
    no_crossfade: true
    label: ""

  # === Phase 1: GT single view (raw background) ===
  - type: flow_gt
    duration: 2.0
    raw: true
    frame_step: 3
    no_crossfade: true
    label: "GT RGB (Camera 0)"

  # === Phase 1b: FG segmentation ===
  - type: flow_mask
    duration: 1.5
    frame_step: 3
    no_crossfade: true
    label: "FG Segmentation (SAM2)"

  # === Phase 1c: Raw 3D Gaussian point cloud (pre-splatting) ===
  - type: flow_raw_gaussians
    duration: 3.0
    frame_step: 3
    point_size: 1.5
    no_crossfade: true
    label: "3D Gaussians (Raw Point Cloud)"

  # === Phase 2: GS-LRM splatting render ===
  - type: flow_render
    duration: 5.0
    frame_step: 3
    no_crossfade: true
    label: "GS-LRM 6v Reconstruction"

  # === Phase 3: 360° frozen-time orbit ===
  - type: freeze_orbit
    duration: 8.0
    elevation: 20
    match_gt: false
    transition_frames: 40
    no_crossfade: true
    label: "360° Orbit (Frozen Time)"

  # === Phase 4: Bottom view with keypoint overlay ===
  - type: flow_novel
    duration: 4.0
    elevation: -80
    use_prev_azimuth: true
    prev_elevation: 20
    transition_frames: 20
    no_crossfade: true
    frame_step: 3
    keypoint_overlay: true
    label: "Bottom View + Keypoints"

  # === Phase 5: Progressive body part reveal (face → +tail → full) + KP ===
  - type: flow_head_kp
    duration: 6.0
    elevation: 25
    zoom: 1.0
    prev_elevation: -80
    transition_frames: 20
    no_crossfade: true
    frame_step: 3
    label: "Body Parts + Keypoints"

  # === Phase 6: Temporal orbit (time + camera rotation simultaneously) ===
  - type: freeze_orbit
    duration: 6.0
    elevation: 20
    temporal: true        # Time advances while camera orbits
    frame_step: 3
    transition_frames: 10
    no_crossfade: true
    label: "Temporal Orbit (Time + Rotation)"

  # === Phase 7: GS-LRM recon → GT zoom-out to 6-cam mosaic ===
  - type: flow_gt_zoom_out
    duration: 3.0
    frame_step: 2
    no_crossfade: true
    fg_only: true
    label: "GT FG-only (6 Cameras)"

  # === Phase 8: 6-view novel grid ===
  - type: grid_novel_6views
    duration: 4.0
    frame_step: 3
    no_crossfade: true
    label: "Novel Views (6 Angles)"

  # === Phase 9: Dense 24-view grid with zoom-out ending ===
  - type: grid_novel_dense
    duration: 5.0
    rows: 4
    cols: 6
    zoom_out: true
    frame_step: 3
    no_crossfade: true
    label: "Dense Novel Views (24 Angles)"
