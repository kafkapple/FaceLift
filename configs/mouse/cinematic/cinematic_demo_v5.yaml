# Cinematic Demo v5.2 — Full fixes: GT bg, camera continuity, smooth transitions, grid ending
# flow: GT (raw bg) → mask → recon → turntable (azimuth-matched) → bottom (sweep) → head+KP → 6-view grid
# Checkpoint: alpha=0.3 (M5t2 trade-off best, IoU=0.913)

global:
  fps: 30
  resolution: 768
  bg_color: [1.0, 1.0, 1.0]
  n_filter: 2
  gt_view: 0
  crossfade: 0.3
  mask_border_color: null
  keypoint_overlay: false  # per-segment control instead

model:
  config: configs/base/gslrm_mouse.yaml
  num_input_views: 6
  checkpoint: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_6view_alpha03_v3/best_psnr.pt
  m5_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  kp_path: ~/data/results/MAMMAL_mouse/v012345_kp22_20260126/keypoints_22_3d.npz

camera:
  radius: 2.7
  hfov: 50

frame_range: "1500:1860"  # 360 frames from mid-dataset (more active behavior)

segments:
  # === Phase 1: Introduction (GT camera, temporal flow) ===
  # 1) RGB original image — raw=true: original background pixels preserved
  - type: flow_gt
    duration: 4.0
    raw: true
    frame_step: 2      # 15 fps behavioral rate (half speed)
    label: "GT RGB (Camera 0)"

  # 2) Segmentation mask
  - type: flow_mask
    duration: 2.5
    frame_step: 2
    label: "Foreground Segmentation (SAM2)"

  # 3) GS-LRM 3D reconstruction (at GT camera, half speed)
  - type: flow_render
    duration: 8.0
    frame_step: 2
    label: "3D Gaussian Reconstruction (alpha=0.3)"

  # === Phase 2: 360 Turntable (freeze time, azimuth-matched to GT cam) ===
  - type: freeze_orbit
    duration: 10.0
    elevation: 20
    transition_frames: 20
    label: "360-degree Turntable"

  # === Phase 3: Bottom view novel view (smooth elevation sweep entry) ===
  - type: flow_novel
    duration: 6.0
    elevation: -80
    prev_elevation: 20      # matches freeze_orbit elevation
    transition_frames: 30   # 1s smoothstep sweep from elev=20 to elev=-80
    frame_step: 2
    label: "Bottom View - Temporal Sequence"

  # === Phase 4: Head close-up + Keypoints (smooth sweep from bottom) ===
  # Direct from bottom view: smooth elevation sweep -80 -> 25, then orbit + KP overlay
  - type: flow_head_kp
    duration: 9.0
    elevation: 25
    zoom: 1.5
    prev_elevation: -80     # matches flow_novel target elevation
    transition_frames: 30   # 1s smoothstep sweep from elev=-80 to elev=25
    frame_step: 2
    label: "Head + Keypoints (Temporal)"

  # === Phase 5: 6-view grid ending ===
  # GT views -> Reconstruction -> Novel views
  - type: grid_multiview
    duration: 12.0
    frame_step: 2
    label: ""   # phase-specific labels added internally
