# Cinematic Sequence — Default config (minimal, smoke-test scale)
# For production (NeurIPS demo, 768px/20fps, 17 segments): cinematic_v11.yaml
# For paper-consistent PLY mode: cinematic_v11_FINAL_alpha03_16k.yaml (best alpha=0.3)
# Spec: docs/specs/CINEMATIC_V11_SPEC.md

global:
  fps: 15
  resolution: 512
  bg_color: [1.0, 1.0, 1.0]
  n_filter: 2
  gt_view: 0
  crossfade: 0.3
  mask_border_color: null
  keypoint_overlay: false
  show_controls: false

model:
  config: configs/base/gslrm_mouse.yaml
  num_input_views: 6
  checkpoint: /node_data/joon/checkpoints/FaceLift/gslrm/M5t2_6view_alpha03_v3/best_psnr.pt
  m5_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  kp_path: ~/data/results/MAMMAL_mouse/v012345_kp22_20260126/keypoints_22_3d.npz

camera:
  radius: 2.7
  hfov: 50

frame_range: "195:315"

segments:
  - type: flow_gt
    duration: 3.0
    raw: true
    frame_step: 2
    label: "GT Camera 0"

  - type: flow_mask
    duration: 2.0
    frame_step: 2
    label: "Foreground Segmentation"

  - type: flow_render
    duration: 3.0
    frame_step: 2
    label: "GS-LRM Reconstruction"

  - type: freeze_orbit
    duration: 8.0
    elevation: 20
    match_gt: false
    transition_frames: 15
    no_crossfade: true
    label: "360-deg Turntable"

  - type: flow_novel
    duration: 4.0
    elevation: -80
    use_prev_azimuth: true
    prev_elevation: 20
    transition_frames: 20
    frame_step: 2
    label: "Bottom View"

  - type: grid_novel_6views
    duration: 6.0
    frame_step: 2
    label: "Novel Views (6 Angles)"
