# Cinematic Base Defaults
# SSOT for model/camera/global blocks shared across cinematic presets.
# Preset yamls override via top-level `extends: _base.yaml` field (deep-merged).

global:
  bg_color: [1.0, 1.0, 1.0]
  n_filter: 2
  gt_view: 0
  crossfade: 0.3
  mask_border_color: null
  keypoint_overlay: false
  show_controls: false
  # fps and resolution intentionally NOT set — preset must specify

model:
  config: configs/base/gslrm_mouse.yaml
  num_input_views: 6
  # M5t2_6view_alpha03_v3/best_psnr.pt symlink target deleted (2026-05-15) — fall back to highest-PSNR drop-in
  # Available: base_uniform_v2_6view_v2 (24.49 PSNR, 6view, no alpha — sharp recon, soft fg edges)
  checkpoint: /node_data/joon/checkpoints/FaceLift/gslrm/base_uniform_v2_6view_v2/best_psnr.pt
  m5_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5
  kp_path: ~/data/results/MAMMAL_mouse/v012345_kp22_20260126/keypoints_22_3d.npz

camera:
  radius: 2.7
  hfov: 50
