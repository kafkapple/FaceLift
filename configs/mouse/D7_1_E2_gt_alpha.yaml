# =============================================================================
# D7_1_E2_gt_alpha: GT Mask + Alpha Supervision
# =============================================================================
# Priority: P0 (RECOMMENDED)
# Dataset: D7.1 (Individual scale, geometric correction)
# Mask: GT mask for RGB loss + MSE alpha supervision
# Reference: LGM (ECCV 2024) + Pose Splatter (NeurIPS 2025)
# =============================================================================

profile: false
debug: false

model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true

training:
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 1
    grad_clip_norm: 1.0
    grad_checkpoint_every: 1

  dataset:
    dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_train.txt
    maximize_view_overlap: false
    num_views: 6
    num_input_views: 5
    target_has_input: false
    normalize_distance_to: 0.0
    remove_alpha: false
    background_color: white

  dataloader:
    batch_size_per_gpu: 2
    num_workers: 4
    num_threads: 32
    prefetch_factor: 16

  losses:
    l2_loss_weight: 1.0
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.0
    lpips_loss_weight: 0.0
    mask_mode: gt
    masked_l2_loss: true
    masked_ssim_loss: false
    masked_pixelalign_loss: false
    use_rendered_alpha_mask: false
    alpha_loss_weight: 0.1
    alpha_loss_type: mse
    bg_loss_weight: 0.0
    pixelalign_loss_weight: 0.0
    pointsdist_loss_weight: 0.0
    warmup_pointsdist: false
    distill_loss_weight: 0.0

  optimizer:
    lr: 0.0001
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
    reset_lr: false
    reset_weight_decay: false
    reset_training_state: true

  schedule:
    num_epochs: 100000
    early_stop_after_epochs: 100000
    max_fwdbwd_passes: 15000
    warmup: 500
    l2_warmup_steps: 500

  checkpointing:
    checkpoint_dir: outputs/D7_1_E2_gt_alpha
    resume_ckpt: null
    checkpoint_every: 500

  logging:
    print_every: 20
    vis_every: 100
    wandb:
      project: FaceLift
      exp_name: D7_1_E2_gt_alpha
      group: D7_1_mask_experiments
      job_type: train
      log_every: 50
      offline: false

# Validation (FLAT structure for legacy mode)
validation:
  enabled: true
  dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_val.txt
  val_every: 200
  output_dir: outputs/D7_1_E2_gt_alpha/validation

visualization:
  turntable_fps: 15
  turntable_num_views: 60
