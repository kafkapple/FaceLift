# =============================================================================
# GS-LRM RTX 3060 (12GB VRAM) Config
# =============================================================================
# Lightweight config for consumer GPU training.
# Base: configs/mouse/uniform/base_uniform_v2.yaml
# Usage: python train_gslrm.py -b configs/mouse/uniform/base_uniform_v2.yaml -e configs/mouse/rtx3060/gslrm_3060.yaml
#
# Key changes from base:
#   - batch_size: 2 -> 1  (~50% VRAM reduction)
#   - amp_dtype: bf16 -> fp16  (RTX 3060 has better fp16 throughput)
#   - turntable views: 144 -> 36  (reduce validation VRAM spike)
#   - val_every: 100 -> 500  (less frequent to save time)
#   - vis_every: 500 -> 1000
#
# Expected VRAM: ~10-11GB (within 12GB budget)
# Created: 2026-02-07
# =============================================================================

# --- Model ---
model:
  num_input_views: 4

# --- Training ---
training:
  runtime:
    amp_dtype: fp16          # fp16 more efficient than bf16 on RTX 3060

  dataloader:
    batch_size_per_gpu: 1    # Halved from 2 to fit 12GB VRAM
    num_workers: 4           # Reduced for lower RAM pressure
    prefetch_factor: 4

  checkpointing:
    checkpoint_dir: /node_data/joon/checkpoints/FaceLift/gslrm/rtx3060_test

  logging:
    vis_every: 1000          # Less frequent visualization
    wandb:
      group: rtx3060
      exp_name: rtx3060_gslrm_4view

# --- Visualization (minimal turntable to save VRAM) ---
visualization:
  turntable:
    num_views: 36            # Reduced from 144
    video_views: 36
    orbit_views: 36
    grid_rows: 6
    grid_cols: 6

# --- Validation ---
validation:
  val_every: 500             # Less frequent than base (100)
