# =============================================================================
# GS-LRM RTX 3060 (12GB VRAM) - 3-View Config
# =============================================================================
# 3-view variant for consumer GPU training.
# Base: configs/mouse/uniform/base_uniform_v2.yaml
# RTX 3060 adjustments from: configs/mouse/rtx3060/gslrm_3060.yaml
# 3-view ref: configs/mouse/uniform/3view_v2.yaml
#
# Usage: python train_gslrm.py -b configs/mouse/uniform/base_uniform_v2.yaml -e configs/mouse/rtx3060/gslrm_3060_3view.yaml
#
# Key changes from gslrm_3060.yaml (4-view):
#   - num_input_views: 4 -> 3
#   - checkpoint_dir: rtx3060_3view
#   - wandb name/tags updated
#
# Expected VRAM: ~9-10GB (slightly less than 4-view)
# Created: 2026-02-24
# =============================================================================

# --- Model ---
model:
  num_input_views: 3

# --- Training ---
training:
  losses:
    lpips_loss_weight: 0.0   # Disable LPIPS VGG (saves ~200MB + forward pass memory on 12GB GPU)
    perceptual_loss_weight: 0.0  # Also disable perceptual (uses VGG features)
  runtime:
    amp_dtype: fp16          # fp16 more efficient than bf16 on RTX 3060

  dataloader:
    batch_size_per_gpu: 1    # Halved from 2 to fit 12GB VRAM
    num_workers: 4           # Reduced for lower RAM pressure
    prefetch_factor: 4

  checkpointing:
    checkpoint_dir: /home/joon/checkpoints/FaceLift/gslrm/rtx3060_3view

  logging:
    vis_every: 1000          # Less frequent visualization
    wandb:
      group: rtx3060
      exp_name: rtx3060_gslrm_3view

# --- Visualization (minimal turntable to save VRAM) ---
visualization:
  turntable:
    num_views: 36            # Reduced from 144
    video_views: 36
    orbit_views: 36
    grid_rows: 6
    grid_cols: 6

# --- Validation (memory-constrained for RTX 3060) ---
validation:
  val_every: 500             # Less frequent than base (100)
  max_val_samples: 10        # OOM fix: only validate 10 of 360 samples
  visual_first_batch: false  # Disable turntable in model forward
  skip_lpips: true           # Skip LPIPS metric during validation (saves ~100MB GPU)
  skip_turntable: true       # Skip turntable rendering in save_validations
  save_images: false         # Skip saving gt_vs_pred images (saves GPU memory)

# --- WandB ---
wandb:
  name: rtx3060_gslrm_3view
  tags:
  - rtx3060
  - M5t2
  - 3view
