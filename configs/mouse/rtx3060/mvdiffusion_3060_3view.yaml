# =============================================================================
# MVDiffusion RTX 3060 (12GB VRAM) - 3-View Config
# =============================================================================
# 3-view variant for consumer GPU training.
# Based on: configs/mvdiffusion/mouse_mvdiffusion_M5t2_3view.yaml
# RTX 3060 adjustments from: configs/mouse/rtx3060/mvdiffusion_3060.yaml
#
# Key changes from 3-view baseline:
#   - train_batch_size: 4 -> 1  (major VRAM reduction)
#   - gradient_accumulation_steps: 4 -> 16  (preserves effective batch=16)
#   - validation_batch_size: 2 -> 1
#   - dataloader_num_workers: 8 -> 4  (less RAM pressure)
#   - output_dir: rtx3060_3view
#
# 3-view specifics (from H8):
#   - n_views: 3, camera_indices: [0, 2, 4] = 120 degree spread
#   - cam_0 (top-front), cam_2 (top-right), cam_4 (top-left)
#
# Expected VRAM: ~4-5GB (fewer views than 6-view variant)
# Created: 2026-02-24
# =============================================================================

n_views: 3
camera_indices: [0, 2, 4]
img_wh: 512
reference_view_idx: 0
dataset_type: "mouse"

pretrained_model_name_or_path: "checkpoints/mvdiffusion/pipeckpts"
pretrained_unet_path: null
revision: null

# 3-view prompt embeddings
prompt_embed_path: "mvdiffusion/data/mouse_prompt_embeds_3view_1024/clr_embeds.pt"

# =============================================================================
# Dataset - M5t2 (Temporal 80:10:10 split)
# =============================================================================
train_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_train.txt
  bg_color: "three_choices"
  augmentation: true
  aug_brightness: [0.9, 1.1]
  aug_contrast: [0.9, 1.1]
  aug_hflip: false

validation_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_val.txt
  bg_color: "white"

# =============================================================================
# Output
# =============================================================================
checkpoint_prefix: ""
output_dir: /home/joon/checkpoints/FaceLift/mvdiffusion/rtx3060_3view
val_out_dir: /home/joon/checkpoints/FaceLift/mvdiffusion/rtx3060_3view/val/

# =============================================================================
# Training Parameters - RTX 3060 optimized
# =============================================================================
seed: 42
train_batch_size: 1                   # Reduced from 4 to fit 12GB VRAM
validation_batch_size: 1              # Reduced from 2
max_train_steps: 10000
gradient_accumulation_steps: 16       # Increased from 4 (effective batch = 1 x 16 = 16)
gradient_checkpointing: true
learning_rate: 5e-5
step_rules: "1:100000,0.5"
scale_lr: false
lr_scheduler: "piecewise_constant"
lr_warmup_steps: 100
snr_gamma: 5.0
use_8bit_adam: false
allow_tf32: true
use_ema: true
dataloader_num_workers: 4             # Reduced from 8 for less RAM pressure

adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null

# =============================================================================
# Logging and Validation
# =============================================================================
vis_dir: vis
logging_dir: logs
mixed_precision: "fp16"
report_to: "wandb"
local_rank: -1
checkpointing_steps: 1000
checkpoints_total_limit: 2
resume_from_checkpoint: null
enable_xformers_memory_efficient_attention: true
validation_steps: 200
validation_sanity_check: true
tracker_project_name: "FaceLift-MVDiffusion"

# WandB
wandb_exp_name: "rtx3060_mvdiff_M5t2_3view"
wandb_group: "rtx3060"
wandb_job_type: "finetune_M5t2_3view"

# =============================================================================
# Training Specifics
# =============================================================================
trainable_modules: null
use_classifier_free_guidance: true
condition_drop_rate: 0.05
drop_type: "drop_as_a_whole"
camera_embedding_lr_mult: 1.
scale_input_latents: true

pipe_kwargs:
  num_views: ${n_views}
validation_guidance_scales: [1., 3.]
validation_grid_nrow: ${n_views}
pipe_validation_kwargs:
  eta: 1.0

unet_from_pretrained_kwargs:
  unclip: true
  num_views: ${n_views}
  sample_size: 64
  zero_init_conv_in: true
  init_mvattn_with_selfattn: false
  cd_attention_last: false
  cd_attention_mid: false
  multiview_attention: true
  sparse_mv_attention: true
  selfattn_block: custom
  addition_downsample: false
