# Quick Mask Mode Training (500 steps)
# mask_mode: gt (L2 only on foreground)
# alpha_loss: 0 (no alpha supervision)
profile: false
debug: false
model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true
training:
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 1
    grad_clip_norm: 50.0
    grad_checkpoint_every: 1
  dataset:
    dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_train.txt
    maximize_view_overlap: false
    random_view_selection: true
    num_views: 6
    num_input_views: 4
    target_has_input: true
    normalize_distance_to: 0.0
    remove_alpha: false
    background_color: white
  dataloader:
    batch_size_per_gpu: 2
    num_workers: 4
    num_threads: 8
    prefetch_factor: 4
  losses:
    l2_loss_weight: 1.0
    lpips_loss_weight: 0.0
    perceptual_loss_weight: 0.0
    ssim_loss_weight: 0.0
    pixelalign_loss_weight: 0.0
    masked_pixelalign_loss: false
    masked_l2_loss: false
    masked_ssim_loss: false
    pointsdist_loss_weight: 0.0
    warmup_pointsdist: false
    distill_loss_weight: 0.0
    clamp_rendering: true
    # Mask mode only (no alpha loss)
    mask_mode: gt
    alpha_mask_threshold: 0.5
    alpha_loss_weight: 0.0
    alpha_loss_type: bce
  optimizer:
    lr: 1.0e-05
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
    reset_lr: true
    reset_weight_decay: false
    reset_training_state: true
  schedule:
    num_epochs: 50000
    max_fwdbwd_passes: 500
    warmup: 50
    l2_warmup_steps: 50
  checkpointing:
    checkpoint_dir: checkpoints/quick_alpha
    checkpoint_every: 100
    resume_ckpt: checkpoints/gslrm/ckpt_0000000000021125.pt
  logging:
    print_every: 10
    vis_every: 100
    wandb:
      project: FaceLift-Mouse
      group: quick_test
      job_type: mask_mode_gt
      exp_name: D7_1_quick_mask_gt
      log_every: 10
      offline: true
mouse:
  use_mouse_dataset: true
  normalize_cameras: false
  normalize_to_z_up: true
visualization:
  turntable_fps: 15
validation:
  enabled: false
inference:
  enabled: false
