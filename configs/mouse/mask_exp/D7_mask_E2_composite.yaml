# D7 Mask E2: Composite Loss (Nerfstudio Style)
# Priority: P1 - Literature: Nerfstudio blend_background
#
# Key Settings:
#   - mask_mode: composite (implicit alpha supervision)
#   - Composites pred with rendered_alpha, gt with gt_mask
#   - Additional explicit alpha supervision (low weight)

profile: false
debug: false

model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true

training:
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 1
    grad_clip_norm: 1.0
    grad_checkpoint_every: 1

  dataset:
    dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_train.txt
    maximize_view_overlap: true
    random_view_selection: false
    num_views: 6
    num_input_views: 4
    target_has_input: true
    normalize_distance_to: 0.0
    remove_alpha: false
    background_color: white

  dataloader:
    batch_size_per_gpu: 2
    num_workers: 8
    num_threads: 16
    prefetch_factor: 8

  losses:
    l2_loss_weight: 1.0
    lpips_loss_weight: 0.0
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.0
    
    # === Composite mode (Nerfstudio) ===
    mask_mode: composite
    background_color: 1.0  # white
    
    # Explicit alpha supervision (lower weight - implicit already helps)
    alpha_loss_weight: 0.05
    alpha_loss_type: mse
    bg_loss_weight: 0.0
    
    # Legacy disabled
    masked_l2_loss: false
    masked_ssim_loss: false
    masked_perceptual_loss: false
    use_rendered_alpha_mask: false
    clamp_rendering: true
    pixelalign_loss_weight: 0.0
    pointsdist_loss_weight: 0.0
    distill_loss_weight: 0.0

  optimizer:
    lr: 1.0e-06
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
    reset_lr: true
    reset_weight_decay: false
    reset_training_state: true

  schedule:
    num_epochs: 50000
    early_stop_after_epochs: 50000
    max_fwdbwd_passes: 5000
    warmup: 500
    l2_warmup_steps: 500

  checkpointing:
    checkpoint_dir: checkpoints/gslrm/D7_mask_E2_composite
    checkpoint_every: 500
    resume_ckpt: checkpoints/gslrm/ckpt_0000000000021125.pt

  logging:
    print_every: 10
    vis_every: 200
    wandb:
      project: FaceLift-Mouse
      group: D7_mask
      job_type: E2_composite
      exp_name: D7_mask_E2_composite
      log_every: 10
      offline: false

mouse:
  augmentation:
    enabled: false
  use_mouse_dataset: true
  normalize_cameras: false
  target_camera_distance: 0.0
  normalize_to_z_up: true
  auto_generate_mask: false
  mask_threshold: 250
  pp_correction: none

visualization:
  turntable_fps: 15

validation:
  enabled: true
  dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D7_1/data_mouse_val.txt
  output_dir: experiments/validation/D7_mask_E2_composite
  val_every: 500

inference:
  enabled: false
