# =============================================================================
# Mouse MVDiffusion - M5t2 RandRef 20K Resume (P0 continuation)
# =============================================================================
# Phase 3 E2: Resume P0 (randref_sparse) with LR decay
# Purpose: Continue P0 training from checkpoint-10000 with reduced LR
# Changes from P0 (randref_sparse):
#   - max_train_steps: 10000 -> 20000
#   - step_rules: "1:100000,0.5" -> "1:10000,0.2" (LR=1e-5 after 10K)
#   - resume_from_checkpoint: "latest"
#
# Rationale: P0 reached baseline PSNR ~27 but oscillated at constant LR 5e-5.
#   Reducing LR to 1e-5 (0.2x) after 10K should stabilize convergence.
#   LambdaLR.load_state_dict() restores last_epoch; new lambda (step_rules)
#   applies immediately since lambda functions are not serialized in state.
#
# IMPORTANT: This config REUSES the existing P0 output directory.
#   The "latest" checkpoint will be found automatically by accelerate.
#
# Version: v1.0
# Created: 2026-02-15
#

n_views: 6
img_wh: 512
reference_view_idx: "random"
dataset_type: "mouse"

pretrained_model_name_or_path: "checkpoints/mvdiffusion/pipeckpts"
pretrained_unet_path: null
revision: null

# Mouse-specific prompt embeddings (top-angled views, 1024-dim)
prompt_embed_path: "mvdiffusion/data/mouse_prompt_embeds_6view_1024/clr_embeds.pt"

# =============================================================================
# Dataset - M5t2 (Temporal 80:10:10 split, no data leakage)
# =============================================================================
train_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_train.txt
  bg_color: "three_choices"
  augmentation: true
  aug_brightness: [0.9, 1.1]
  aug_contrast: [0.9, 1.1]
  aug_hflip: false

validation_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_val.txt
  bg_color: "white"

# =============================================================================
# Output — REUSES existing P0 directory for resume
# =============================================================================
checkpoint_prefix: ""
output_dir: "/node_data/joon/checkpoints/FaceLift/mvdiffusion/mouse_M5t2_randref_sparse"
val_out_dir: "/node_data/joon/checkpoints/FaceLift/mvdiffusion/mouse_M5t2_randref_sparse/val/"

# =============================================================================
# Training Parameters
# =============================================================================
seed: 42
train_batch_size: 4
validation_batch_size: 2
max_train_steps: 20000                    # Extended from 10K
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 5e-5
step_rules: "1:10000,0.2"                # After step 10K: LR = 5e-5 * 0.2 = 1e-5
scale_lr: false
lr_scheduler: "piecewise_constant"
lr_warmup_steps: 100
snr_gamma: 5.0
use_8bit_adam: false
allow_tf32: true
use_ema: true
dataloader_num_workers: 8
resume_from_checkpoint: "latest"          # Resume from P0 checkpoint-10000

adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null

# =============================================================================
# Logging and Validation
# =============================================================================
vis_dir: vis
logging_dir: logs
mixed_precision: "fp16"
report_to: "wandb"
local_rank: -1
checkpointing_steps: 1000
checkpoints_total_limit: 3
enable_xformers_memory_efficient_attention: true
validation_steps: 200
validation_sanity_check: true
tracker_project_name: "FaceLift-MVDiffusion"

# WandB — continues existing run
wandb_exp_name: "mvdiff_M5t2_randref_sparse"
wandb_group: "mvdiffusion"
wandb_job_type: "finetune_M5t2_randref_sparse"
wandb_run_id: null

# =============================================================================
# Training Specifics
# =============================================================================
trainable_modules: null
use_classifier_free_guidance: true
condition_drop_rate: 0.05
drop_type: "drop_as_a_whole"
camera_embedding_lr_mult: 1.
scale_input_latents: true

pipe_kwargs:
  num_views: ${n_views}
validation_guidance_scales: [1., 3.]
validation_grid_nrow: ${n_views}
pipe_validation_kwargs:
  eta: 1.0

unet_from_pretrained_kwargs:
  unclip: true
  num_views: ${n_views}
  sample_size: 64
  zero_init_conv_in: true
  init_mvattn_with_selfattn: false
  cd_attention_last: false
  cd_attention_mid: false
  multiview_attention: true
  sparse_mv_attention: true
  selfattn_block: custom
  addition_downsample: false
