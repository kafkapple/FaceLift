# =============================================================================
# Mouse MVDiffusion - M5t2 PAPER-ALIGNED (E0)
# =============================================================================
# Closest to original FaceLift paper (Lyu et al., 2024) settings:
#   - augmentation: false (paper uses none)
#   - learning_rate: 1e-4 (paper value, was 5e-5)
#   - max_train_steps: 20000 (paper value, was 10000)
#   - condition_drop_rate: 0.05 (paper value, already in base)
#
# Changes from mouse_mvdiffusion_M5t2.yaml:
#   1. augmentation: true -> false
#   2. learning_rate: 5e-5 -> 1e-4
#   3. max_train_steps: 10000 -> 20000
#   4. checkpointing_steps: 1000 -> 2000
#   5. validation_steps: 200 -> 400
#
# Unchanged (already paper-aligned):
#   - condition_drop_rate: 0.05
#   - snr_gamma: 5.0
#   - use_ema: true
#   - sparse_mv_attention: true (matching base)
#
# Hardware-limited (cannot match paper):
#   - effective batch: 16 (paper: 64)
#   - GPUs: 1-2x A6000 (paper: 8x A100)
#
# Version: v1.0
# Created: 2026-02-10
#

n_views: 6
img_wh: 512
reference_view_idx: 0
dataset_type: "mouse"

pretrained_model_name_or_path: "checkpoints/mvdiffusion/pipeckpts"
pretrained_unet_path: null
revision: null

prompt_embed_path: "mvdiffusion/data/mouse_prompt_embeds_6view_1024/clr_embeds.pt"

# =============================================================================
# Dataset - NO augmentation (paper-faithful)
# =============================================================================
train_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_train.txt
  bg_color: "three_choices"
  # NO augmentation - original FaceLift paper uses none

validation_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_val.txt
  bg_color: "white"

# =============================================================================
# Output
# =============================================================================
checkpoint_prefix: ""
output_dir: "/node_data/joon/checkpoints/FaceLift/mvdiffusion/mouse_M5t2_paper_aligned"
val_out_dir: "/node_data/joon/checkpoints/FaceLift/mvdiffusion/mouse_M5t2_paper_aligned/val/"

# =============================================================================
# Training Parameters - Paper-aligned
# =============================================================================
seed: 42
train_batch_size: 4
validation_batch_size: 2
max_train_steps: 20000
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1e-4
step_rules: "1:100000,0.5"
scale_lr: false
lr_scheduler: "piecewise_constant"
lr_warmup_steps: 100
snr_gamma: 5.0
use_8bit_adam: false
allow_tf32: true
use_ema: true
dataloader_num_workers: 8

adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null

# =============================================================================
# Logging and Validation
# =============================================================================
vis_dir: vis
logging_dir: logs
mixed_precision: "fp16"
report_to: "wandb"
local_rank: -1
checkpointing_steps: 2000
checkpoints_total_limit: 3
resume_from_checkpoint: checkpoint-2000
enable_xformers_memory_efficient_attention: true
validation_steps: 400
validation_sanity_check: true
tracker_project_name: "FaceLift-MVDiffusion"

# WandB
wandb_exp_name: "mvdiff_E0_paper_aligned"
wandb_group: "mvdiffusion_ablation"
wandb_job_type: "finetune_E0_paper"

# =============================================================================
# Training Specifics
# =============================================================================
trainable_modules: null
use_classifier_free_guidance: true
condition_drop_rate: 0.05
drop_type: "drop_as_a_whole"
camera_embedding_lr_mult: 1.
scale_input_latents: true

pipe_kwargs:
  num_views: ${n_views}
validation_guidance_scales: [1., 3.]
validation_grid_nrow: ${n_views}
pipe_validation_kwargs:
  eta: 1.0

unet_from_pretrained_kwargs:
  unclip: true
  num_views: ${n_views}
  sample_size: 64
  zero_init_conv_in: true
  init_mvattn_with_selfattn: false
  cd_attention_last: false
  cd_attention_mid: false
  multiview_attention: true
  sparse_mv_attention: true
  selfattn_block: custom
  addition_downsample: false
