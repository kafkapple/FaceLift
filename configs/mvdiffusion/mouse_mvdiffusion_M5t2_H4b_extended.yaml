# =============================================================================
# Mouse MVDiffusion - H4b: Cascading Fine-tuning (2nd stage)
# =============================================================================
# Hypothesis: H4 demonstrated that lower-LR fine-tuning recovers and exceeds
# H3 quality (26.25 > 25.99 at step 1400). Continuing with even lower LR
# (2e-6, 5x lower than H4's 1e-5) should push further toward E2's 27.70
# while retaining pose conditioning benefits.
#
# Evidence: H4 step 1400 already +0.26 dB over H3 final. Cascading pattern:
#   E2 (5e-5, 20K) → H3 (5e-5, 10K, +pose) → H4 (1e-5, 10K) → H4b (2e-6, 10K)
#
# Base: H4 checkpoint-10000 (best model from H4 extended training)
# Key change vs H4: learning_rate: 1e-5 → 2e-6
#
# Version: v1.0
# Created: 2026-02-24
# =============================================================================

n_views: 6
img_wh: 512
reference_view_idx: "random"
dataset_type: "mouse"

# Pose Conditioning (same as H3/H4)
pose_conditioning:
  enabled: true
  method: "extrinsic"
  integration: "add"
  embed_dim: 1024
  camera_json: "mouse_extensions/inference/cameras/m5_cameras.json"

pretrained_model_name_or_path: "checkpoints/mvdiffusion/pipeckpts"
# H4 best checkpoint (cascading from H3 → H4 → H4b)
pretrained_unet_path: "/node_data/joon/checkpoints/FaceLift/mvdiffusion/mouse_M5t2_H4_extended/checkpoint-10000/unet"
revision: null

prompt_embed_path: "mvdiffusion/data/mouse_prompt_embeds_6view_1024/clr_embeds.pt"

# =============================================================================
# Dataset - M5t2 (Temporal 80:10:10 split)
# =============================================================================
train_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_train.txt
  bg_color: "three_choices"
  augmentation: true
  aug_brightness: [0.9, 1.1]
  aug_contrast: [0.9, 1.1]
  aug_hflip: false

validation_dataset:
  path: /home/joon/data/preprocessed/FaceLift_mouse/M5/data_mouse_t2_val.txt
  bg_color: "white"

# =============================================================================
# Output
# =============================================================================
checkpoint_prefix: ""
output_dir: "/node_data/joon/checkpoints/FaceLift/mvdiffusion/mouse_M5t2_H4b_extended"
val_out_dir: "/node_data/joon/checkpoints/FaceLift/mvdiffusion/mouse_M5t2_H4b_extended/val/"

# =============================================================================
# Training Parameters — KEY CHANGE: LR 2e-6 (5x lower than H4)
# =============================================================================
seed: 42
train_batch_size: 4
validation_batch_size: 2
max_train_steps: 10000
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 2e-6                    # KEY CHANGE: 1e-5 → 2e-6 (5x lower)
step_rules: null
scale_lr: false
lr_scheduler: "cosine"
lr_warmup_steps: 100
snr_gamma: 5.0
use_8bit_adam: false
allow_tf32: true
use_ema: true
dataloader_num_workers: 8

adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null

# =============================================================================
# Logging and Validation
# =============================================================================
vis_dir: vis
logging_dir: logs
mixed_precision: "fp16"
report_to: "wandb"
local_rank: -1
checkpointing_steps: 1000
checkpoints_total_limit: 3
resume_from_checkpoint: null
enable_xformers_memory_efficient_attention: true
validation_steps: 200
validation_sanity_check: true
tracker_project_name: "FaceLift-MVDiffusion"

# WandB
wandb_exp_name: "mvdiff_M5t2_H4b_extended"
wandb_group: "mvdiffusion"
wandb_job_type: "finetune_M5t2_H4b_extended"
wandb_run_id: null

# =============================================================================
# Training Specifics (same as H3/H4)
# =============================================================================
trainable_modules: null
use_classifier_free_guidance: true
condition_drop_rate: 0.05
drop_type: "drop_as_a_whole"
camera_embedding_lr_mult: 1.
scale_input_latents: true

pipe_kwargs:
  num_views: ${n_views}
validation_guidance_scales: [1., 3.]
validation_grid_nrow: ${n_views}
pipe_validation_kwargs:
  eta: 1.0

unet_from_pretrained_kwargs:
  unclip: true
  num_views: ${n_views}
  sample_size: 64
  zero_init_conv_in: true
  init_mvattn_with_selfattn: false
  cd_attention_last: false
  cd_attention_mid: false
  multiview_attention: true
  sparse_mv_attention: true
  selfattn_block: custom
  addition_downsample: false
