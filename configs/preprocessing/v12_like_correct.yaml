# Preprocessing Config v12: data_mouse_correct 방식 재현
# 
# 특징:
#   - apply_centering: true (객체 중앙 정렬)
#   - force_center_cxcy: true (cx=cy=256 강제)
#   - preserve_fy_ratio: true (원본 aspect ratio 유지)
#
# data_mouse_correct와 동일한 결과 생성

version: v12
description: "Matches data_mouse_correct behavior exactly"

# 전처리 파라미터
preprocessing:
  apply_centering: true          # 객체를 이미지 중앙으로 이동
  force_center_cxcy: true        # cx=cy=256 강제 (centering 후 자연스러움)
  preserve_fy_ratio: true        # fy/fx 비율 유지
  
# 타겟 카메라 파라미터
target:
  image_size: 512
  fx: 549.0
  distance: 2.7

# 출력 설정  
output:
  format: rgba_png
  background_color: white
