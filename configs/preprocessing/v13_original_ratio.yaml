# Preprocessing Config v13: Original Aspect Ratio
# 생성일: 2025-01-14
# 용도: 원본 카메라 비율 유지 (v15 재현 비교 실험용)

name: v13_original_ratio
description: "원본 aspect ratio 유지 (fy≠fx)"

preprocessing:
  script_version: v5           # convert_markerless_unified.py --version

camera:
  target_fx: 549
  target_fy: original          # 원본 비율 유지 (~551.35)
  target_distance: 2.7
  cx_cy: center                # 256, 256

sampling:
  frame_interval: 5
  total_samples: 3597

image:
  format: RGBA
  size: 512
  background: white

split:
  method: temporal_stratified
  val_ratio: 0.1
  num_strata: 10
  seed: 42
