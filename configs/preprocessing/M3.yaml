# M3: Object-Centered Zoom Preprocessing
# Combines M1's geometric accuracy with object centering for optimal performance

preset: M3
description: "Object-Centered Zoom - optimal for mouse 3D reconstruction"

# Base paradigm
paradigm: object_centered_zoom
base_preset: M1  # Inherit M1's geometric accuracy

# Step 1: Object center estimation
centering:
  method: triangulation  # 3D DLT triangulation
  fallback: bbox_average  # If triangulation fails
  tolerance_px: 15  # Max center offset from image center

# Step 2: Adaptive zoom
zoom:
  enabled: true
  target_fg_coverage: 0.05  # 5%
  min_zoom: 1.0
  max_zoom: 2.5
  coverage_estimation: mask_area  # Use mask to estimate coverage

# Step 3: Cropping
crop:
  method: center_crop  # Crop around object center
  output_size: 512
  padding_mode: edge  # Edge padding if needed

# Step 4: Camera normalization (M1 settings)
normalization:
  enabled: true
  target_fx: 549.0
  target_fy: 549.0  # Will be adjusted proportionally
  target_cx: 256.0
  target_cy: 256.0
  target_distance: 2.7

# Transform settings (from M1)
transform:
  type: affine
  scale_mode: individual  # fx, fy scaled individually
  pp_method: shift_to_256
  interpolation: bilinear

# Quality checks
validation:
  check_ray_error: true
  max_ray_error_deg: 0.5
  check_fg_coverage: true
  min_fg_coverage: 0.03
  check_center_offset: true
  max_center_offset_px: 20

# Output format
output:
  image_format: png
  camera_format: json
  include_metadata: true
  include_masks: true
