_name: D10_1
_description: "D10 + Adaptive zoom (bbox-based, 80% fill)"
_category: up_aligned_zoom
_status: PROPOSED
_preprocessing:
  paradigm: up_aligned_zoom
  transform: homography
  up_alignment: true
  up_source: vertical_lines
  adaptive_zoom: true
  zoom_range: [1.2, 1.5]
  zoom_fill_ratio: 0.8
  skew_correction: true

training:
  dataset:
    dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D10_1/data_mouse_train.txt

validation:
  dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D10_1/data_mouse_val.txt

