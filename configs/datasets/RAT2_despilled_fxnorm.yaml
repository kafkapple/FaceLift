# Dataset: RAT2 (despilled + fx-normalized)
# Pipeline: raw → sdannce_to_gslrm.py → despill.py → normalize_fx.py
# Stage 1: green despill (G/R 0.977→0.798)
# Stage 2: fx normalization (fx=605→549, affine scaling)
_name: RAT2_despilled_fxnorm
_description: "Lone rat (despilled then fx-normalized to 549) fine-tuning dataset"

training:
  dataset:
    data_path: /node_data/joon/data/preprocessed/FaceLift_rat/rat2_s1despill_s2fxnorm
    dataset_path: /node_data/joon/data/preprocessed/FaceLift_rat/rat2_s1despill_s2fxnorm/data_rat2_train.txt

validation:
  data_path: /node_data/joon/data/preprocessed/FaceLift_rat/rat2_s1despill_s2fxnorm
  dataset_path: /node_data/joon/data/preprocessed/FaceLift_rat/rat2_s1despill_s2fxnorm/data_rat2_val.txt

test:
  data_path: /node_data/joon/data/preprocessed/FaceLift_rat/rat2_s1despill_s2fxnorm
  dataset_path: /node_data/joon/data/preprocessed/FaceLift_rat/rat2_s1despill_s2fxnorm/data_rat2_test.txt
