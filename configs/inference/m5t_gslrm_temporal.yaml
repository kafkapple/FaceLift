# GS-LRM Only Temporal Sequence (6-view input)
_base_: default.yaml

input:
  mode: batch
  data_dir: /home/joon/data/preprocessed/FaceLift_mouse/M5t
  view_idx: null
  frame_range:
    start: 0
    end: 100
    step: 1

pipeline:
  mvdiffusion:
    enabled: false
  gslrm:
    checkpoint: /node_data/joon/checkpoints/FaceLift/gslrm/M5t_E0_1_facelift/best_psnr.pt
    config: configs/base/gslrm_mouse.yaml

rendering:
  resolution: 384
  num_views: 36
  elevation: 20.0
  radius: 2.7
  rotation_speed: 0.25

output:
  dir: outputs/m5t_gslrm_temporal
  gaussian: true
  per_sample: false
  rerun: true
  video:
    enabled: true
    fps: 10
    types: [turntable, time_fixed, time_rotating, grid_6view]
