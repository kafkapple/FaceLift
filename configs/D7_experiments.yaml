# D7 Experiment Configurations
# ================================
#
# D7: PP-Centered Shift (Mathematically Correct PP=256)
#
# Key difference from D6:
# - D6-3: Object-centered crop + PP varies (correct geometry, PP≠256)
# - D7: PP-centered shift + PP=256 (correct geometry, PP=256)
#
# D7 Trade-off:
# - Object may be ~30-40px off-center
# - But PP=256 matches FaceLift pretrained model expectation
#
# Mathematical justification:
# - Image shift by Δ + PP shift by Δ = mathematically equivalent
# - Reference: https://ksimek.github.io/2013/08/13/intrinsic/
#
# MASK MODES:
# - E1_baseline: NO MASK (paper-like, full loss on all pixels)
# - E2_gtmask: GT mask based (loss only on foreground)
# - E3_alpha: Rendered alpha mask (self-supervised)

# ==============================================================================
# D7: PP-Centered Shift (PP=256, Mathematically Consistent)
# ==============================================================================

---
# BASELINE: Paper-like NO MASK (full loss on all pixels)
D7_E1_baseline:
  # Data
  data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_train.txt
  val_data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_val.txt

  # Views
  num_input_views: 4
  input_view_selection: "front"

  # Loss - NO MASK (paper baseline)
  losses:
    mask_mode: "none"
    masked_l2_loss: false
    masked_ssim_loss: false
    masked_pixelalign_loss: false
    use_rendered_alpha_mask: false
    use_predicted_mask: false

    # Weights
    l2_loss_weight: 1.0
    ssim_loss_weight: 0.2
    background_loss_weight: 0.0

  # Training
  batch_size: 4
  num_workers: 4
  max_steps: 10000
  val_every: 200

  # Optimizer
  lr: 1.0e-4
  weight_decay: 0.05
  grad_clip_norm: 1.0

  # AMP (mixed precision)
  use_amp: true
  amp_dtype: bf16

  # Visualization
  visualization:
    turntable_fps: 15
    turntable_num_views: 60

  # Logging
  project_name: "FaceLift_Mouse_D7"
  exp_name: "D7_E1_baseline"

---
# GT MASK: Loss only on foreground region defined by GT mask
D7_E2_gtmask:
  # Data
  data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_train.txt
  val_data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_val.txt

  # Views
  num_input_views: 4
  input_view_selection: "front"

  # Loss - GT MASK based
  losses:
    mask_mode: "gt"
    masked_l2_loss: true
    masked_ssim_loss: true
    masked_pixelalign_loss: true
    use_rendered_alpha_mask: false
    use_predicted_mask: false

    # Weights
    l2_loss_weight: 1.0
    ssim_loss_weight: 0.2
    background_loss_weight: 1.0

  # Training
  batch_size: 4
  num_workers: 4
  max_steps: 10000
  val_every: 200

  # Optimizer
  lr: 1.0e-4
  weight_decay: 0.05
  grad_clip_norm: 1.0

  # AMP
  use_amp: true
  amp_dtype: bf16

  # Visualization
  visualization:
    turntable_fps: 15
    turntable_num_views: 60

  # Logging
  project_name: "FaceLift_Mouse_D7"
  exp_name: "D7_E2_gtmask"

---
# ALPHA MASK: Self-supervised using rendered alpha
D7_E3_alpha:
  # Data
  data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_train.txt
  val_data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_val.txt

  # Views
  num_input_views: 4
  input_view_selection: "front"

  # Loss - ALPHA MASK
  losses:
    mask_mode: "alpha"
    masked_l2_loss: true
    masked_ssim_loss: true
    masked_pixelalign_loss: true
    use_rendered_alpha_mask: true
    use_predicted_mask: false

    # Safer alpha settings
    alpha_mask_threshold: 0.3
    min_mask_ratio: 0.1

    # Weights
    l2_loss_weight: 1.0
    ssim_loss_weight: 0.2
    background_loss_weight: 0.5

  # Training
  batch_size: 4
  num_workers: 4
  max_steps: 10000
  val_every: 200

  # Optimizer
  lr: 1.0e-4
  weight_decay: 0.05
  grad_clip_norm: 1.0

  # AMP
  use_amp: true
  amp_dtype: bf16

  # Visualization
  visualization:
    turntable_fps: 15
    turntable_num_views: 60

  # Logging
  project_name: "FaceLift_Mouse_D7"
  exp_name: "D7_E3_alpha"

# ==============================================================================
# Comparison Summary
# ==============================================================================
#
# | Dataset | PP Value | Object Position | Geometry | FaceLift Compat |
# |---------|----------|-----------------|----------|-----------------|
# | D4      | 256      | Center          | WRONG    | Appears OK      |
# | D6-3    | Varies   | Center          | CORRECT  | PP mismatch?    |
# | D7      | 256      | Off-center      | CORRECT  | IDEAL           |
#
# Hypothesis: D7 should perform best because:
# 1. PP=256 matches FaceLift pretrained model
# 2. Geometry is mathematically consistent
# 3. Object off-center (~30px) is minor compared to PP error in D4 (~150px)
#
# Key experiments to run:
# 1. D7_E1 vs D6-3_E1 vs D4_E1: Compare preprocessing methods
# 2. D7_E2 vs D7_E1: Effect of GT mask
# 3. D7_E3 vs D7_E2: Self-supervised alpha vs GT mask
