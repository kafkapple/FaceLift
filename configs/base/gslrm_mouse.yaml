# =============================================================================
# GS-LRM Mouse Base Configuration
# =============================================================================
# Common settings shared across all mouse experiments
# Override with dataset and experiment configs
# =============================================================================

profile: false
debug: false

# -----------------------------------------------------------------------------
# Model Architecture (Fixed)
# -----------------------------------------------------------------------------
model:
  class_name: gslrm.model.gslrm.GSLRM
  image_tokenizer:
    image_size: 512
    patch_size: 8
    in_channels: 9
  transformer:
    d: 1024
    d_head: 64
    n_layer: 24
  gaussians:
    n_gaussians: 2
    sh_degree: 0
    upsampler:
      upsample_factor: 1
  add_refsrc_marker: false
  hard_pixelalign: true
  use_custom_plucker: true
  clip_xyz: true

  # View configuration (can be overridden by experiment configs)
  num_views: 6           # Total views for target rendering
  num_input_views: 4     # Input views for encoding

# -----------------------------------------------------------------------------
# Training Runtime (Fixed)
# -----------------------------------------------------------------------------
training:
  runtime:
    use_tf32: true
    use_amp: true
    amp_dtype: bf16
    torch_compile: false
    grad_accum_steps: 1
    grad_clip_norm: 50.0
    grad_checkpoint_every: 1

  # Dataloader settings
  dataloader:
    batch_size_per_gpu: 2
    num_workers: 8
    num_threads: 16
    prefetch_factor: 8

  # Dataset defaults (overridden by dataset config)
  dataset:
    maximize_view_overlap: false
    target_has_input: true
    normalize_distance_to: 0.0
    remove_alpha: false
    background_color: white

    # Camera exclusion for ablation experiments (leave-one-out)
    # Use EITHER exclude OR include (not both)
    exclude_camera_indices: []     # e.g., [3] to exclude camera 3
    # include_camera_indices: null # e.g., [0,1,2,4,5] to include only these

  # Loss defaults (overridden by experiment config)
  losses:
    l2_loss_weight: 1.0
    lpips_loss_weight: 0.0
    perceptual_loss_weight: 0.5
    ssim_loss_weight: 0.0
    pixelalign_loss_weight: 0.0
    pointsdist_loss_weight: 0.0
    warmup_pointsdist: false
    distill_loss_weight: 0.0

    # Opacity regularization (reduces floaters/ghosting)
    opacity_reg_weight: 0.0       # 0.0=disabled, 0.01-0.02=recommended
    opacity_reg_type: entropy     # entropy | l1_sparse | binary
    clamp_rendering: true

  # Optimizer settings
  optimizer:
    lr: 1.0e-06
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
    reset_lr: true
    reset_weight_decay: false
    reset_training_state: true

  # Schedule settings
  schedule:
    num_epochs: 50000
    early_stop_after_epochs: 50000
    max_fwdbwd_passes: 15000
    warmup: 500
    l2_warmup_steps: 500

  # Checkpointing defaults (paths auto-generated)
  checkpointing:
    checkpoint_every: 100
    resume_ckpt: checkpoints/gslrm/ckpt_0000000000021125.pt

  # Logging defaults
  logging:
    print_every: 10
    vis_every: 100
    wandb:
      group: mouse
      job_type: train
      exp_name: null
      project: FaceLift-Mouse
      log_every: 10
      offline: false

# -----------------------------------------------------------------------------
# Mouse-specific settings (Fixed)
# -----------------------------------------------------------------------------
mouse:
  augmentation:
    enabled: false
  use_mouse_dataset: true
  normalize_cameras: false
  target_camera_distance: 0.0
  normalize_to_z_up: true
  auto_generate_mask: false
  mask_threshold: 250
  pp_correction: none

# -----------------------------------------------------------------------------
# Visualization (Fixed)
# -----------------------------------------------------------------------------
visualization:
  # Turntable visualization settings
  turntable:
    # Standard 360° turntable (smooth_trajectory=false)
    smooth_trajectory: false   # Interpolate between dataset cameras
    loop: true                # Return to first camera
    # Training/validation (grid image)
    num_views: 60           # Total views for grid (default 8x8=64)
    resolution: 384         # Render resolution
    elevation: 20           # Camera elevation in degrees
    radius: 2.7             # Camera distance from center
    grid_rows: 6            # Grid layout rows (6x10=60 for smooth trajectory)
    grid_cols: 10            # Grid layout cols
    save_video: true        # Save turntable mp4 during training

    # Inference (video)
    inference_views: 150    # Frames for turntable video
    inference_resolution: null  # null = use input resolution
    fps: 10                 # Video framerate

# -----------------------------------------------------------------------------
# Validation defaults (paths auto-generated)
# -----------------------------------------------------------------------------
validation:
  enabled: true
  val_every: 200

# -----------------------------------------------------------------------------
# Inference defaults
# -----------------------------------------------------------------------------
inference:
  enabled: false
