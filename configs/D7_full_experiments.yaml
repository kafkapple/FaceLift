# =============================================================================
# Quick Reference - Training Commands
# =============================================================================
#
# Single GPU:
#   python train_gslrm.py --config configs/D7_full_experiments.yaml --experiment D7_E1_baseline
#
# Multi-GPU (4 GPUs):
#   torchrun --nproc_per_node=4 train_gslrm.py --config configs/D7_full_experiments.yaml --experiment D7_E1_baseline
#
# With pretrained checkpoint:
#   python train_gslrm.py --config configs/D7_full_experiments.yaml --experiment D7_E1_baseline --resume checkpoints/gslrm_pretrained.pt
#
# Experiments to run in order:
#   1. D7_E1_baseline  - No mask baseline
#   2. D7_E2_gtmask    - GT mask foreground loss
#   3. D7_E3_alpha     - Self-supervised alpha mask
#   4. D7_E4_long      - Long training with best config
#
