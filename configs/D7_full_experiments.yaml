# =============================================================================
# D7 Mouse Dataset - Full Experiment Configurations
# =============================================================================
#
# Dataset: D7 (PP-Centered Shift)
# - PP = (256, 256) for all views (mathematically correct)
# - fx = 549 (matches FaceLift pretrained)
# - Geometry: Correct (shift preserves ray directions)
#
# Experiments:
# - E1: Baseline (no mask, full loss)
# - E2: GT Mask (foreground-only loss)
# - E3: Alpha Mask (self-supervised)
# - E4: Long training (20k steps)
#
# =============================================================================

# -----------------------------------------------------------------------------
# E1: Baseline - No Mask (Paper-like)
# -----------------------------------------------------------------------------
---
D7_E1_baseline:
  # General
  profile: false
  debug: false

  # Model (use pretrained GS-LRM)
  model:
    class_name: gslrm.model.gslrm.GSLRM
    image_tokenizer:
      image_size: 512
      patch_size: 8
      in_channels: 9
    transformer:
      d: 1024
      d_head: 64
      n_layer: 24
    gaussians:
      n_gaussians: 2
      sh_degree: 0
      upsampler:
        upsample_factor: 1
    add_refsrc_marker: false
    hard_pixelalign: true
    use_custom_plucker: true
    clip_xyz: true

  # Training
  training:
    runtime:
      use_tf32: true
      use_amp: true
      amp_dtype: "bf16"
      torch_compile: false
      grad_accum_steps: 1
      grad_clip_norm: 1.0
      grad_checkpoint_every: 1

    dataset:
      dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_train.txt
      maximize_view_overlap: true
      num_views: 6
      num_input_views: 4
      target_has_input: true
      normalize_distance_to: 0.0
      remove_alpha: false
      background_color: "white"

    dataloader:
      batch_size_per_gpu: 4
      num_workers: 4
      num_threads: 32
      prefetch_factor: 16

    losses:
      # No mask - full loss on all pixels
      l2_loss_weight: 1.0
      lpips_loss_weight: 0.0
      perceptual_loss_weight: 0.5
      ssim_loss_weight: 0.2
      pixelalign_loss_weight: 0.0
      masked_pixelalign_loss: false
      masked_l2_loss: false
      masked_ssim_loss: false
      pointsdist_loss_weight: 0.0
      warmup_pointsdist: false
      distill_loss_weight: 0.0

    optimizer:
      lr: 0.0001
      beta1: 0.9
      beta2: 0.95
      weight_decay: 0.05
      reset_lr: false
      reset_weight_decay: false
      reset_training_state: true

    schedule:
      num_epochs: 100000
      early_stop_after_epochs: 100000

  # Validation
  validation:
    dataset:
      dataset_path: /home/joon/data/preprocessed/FaceLift_mouse/D7/data_mouse_val.txt
      maximize_view_overlap: true
      num_views: 6
      num_input_views: 4
      target_has_input: false
      normalize_distance_to: 0.0
      remove_alpha: false
      background_color: "white"
    dataloader:
      batch_size_per_gpu: 1
      num_workers: 2
    val_every: 200
    max_steps: 10000

  # Checkpoint
  checkpoint:
    save_every: 1000
    keep_last_n: 3
    resume_from: null  # or path to pretrained checkpoint

  # Logging
  logging:
    project_name: "FaceLift_Mouse_D7"
    exp_name: "D7_E1_baseline"
    log_every: 50

  # Visualization
  visualization:
    turntable_fps: 15
    turntable_num_views: 60

