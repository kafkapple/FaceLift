# ==============================================================================
# Experiment Plan Summary
# ==============================================================================
#
# Priority 1: Compare preprocessing methods (baseline, no mask)
#   - D7_E1_baseline    (fx=549, PP=256, 56% coverage)
#   - D7.5_E1_baseline  (fx=641-706, PP=256, 72-87% coverage)
#   - D7.5b_E1_baseline (fx=852-1184, PP=256, 100% object coverage)
#
# Priority 2: Best preprocessing + GT mask
#   - Winner_E2_gtmask
#
# Research Questions:
# 1. Does FaceLift need exact fx=549, or just PP=256?
# 2. Does larger object (D7.5b) help with detail reconstruction?
# 3. Is there a sweet spot between D7 and D7.5b?
#
# Expected Results:
# - If fx=549 critical: D7 > D7.5 > D7.5b
# - If PP=256 sufficient: D7.5b ≥ D7.5 ≥ D7 (more detail visible)
