# D7.5 & D7.5b Experiment Configurations
# ========================================
#
# D7.5 Series: PP=256 with Optimal Coverage
#
# | Method | fx        | PP      | Coverage | Object Clipping |
# |--------|-----------|---------|----------|-----------------|
# | D7     | 549 fixed | 256     | ~56%     | None            |
# | D7.5   | 641-706   | 256     | ~72-87%  | None (full img) |
# | D7.5b  | 852-1184  | 256     | 100%     | None (bbox)     |
#
# Key Trade-offs:
# - D7: FaceLift pretrained fx=549 exact match, but lots of padding
# - D7.5: Full image preserved, fx varies per view
# - D7.5b: Maximum object zoom, fx varies more, background may clip
#
# Research Question:
# Does FaceLift's pretrained model require exact fx=549, or can it
# generalize to varying focal lengths while PP=256 is maintained?

# ==============================================================================
# D7.5: PP=256 + Full Image Coverage (fx varies: 641-706)
# ==============================================================================

---
D7_5_E1_baseline:
  # Data
  data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7.5/data_mouse_train.txt
  val_data_path: /home/joon/data/preprocessed/FaceLift_mouse/D7.5/data_mouse_val.txt

  # Views
  num_input_views: 4
  input_view_selection: "front"

  # Loss - NO MASK (baseline)
  losses:
    mask_mode: "none"
    masked_l2_loss: false
    masked_ssim_loss: false
    masked_pixelalign_loss: false
    use_rendered_alpha_mask: false
    use_predicted_mask: false
    l2_loss_weight: 1.0
    ssim_loss_weight: 0.2

  # Training
  batch_size: 4
  num_workers: 4
  max_steps: 10000
  val_every: 200

  # Optimizer
  lr: 1.0e-4
  weight_decay: 0.05
  grad_clip_norm: 1.0

  # AMP
  use_amp: true
  amp_dtype: bf16

  # Visualization
  visualization:
    turntable_fps: 15
    turntable_num_views: 60

  # Logging
  project_name: "FaceLift_Mouse_D7"
  exp_name: "D7.5_E1_baseline"

  # Notes
  _notes:
    method: "D7.5 - Full image coverage with PP=256"
    fx_range: "641-706 (varies per view)"
    coverage: "72-87%"
    pp: "(256, 256) for all views"

